name: INTCALC retired verifier boundary
on:
  pull_request:
    paths:
      - 'tools/qualify_intcalc_preview_build_gate.py'
      - 'src/lightyear_factory/__init__.py'
      - 'src/lightyear_factory/intcalc_preview_admission.py'
      - 'src/lightyear_factory/intcalc_preview_bootstrap.py'
      - 'src/lightyear_factory/intcalc_preview_build_gate.py'
      - 'src/lightyear_factory/intcalc_preview_composition.py'
      - 'src/lightyear_factory/intcalc_preview_ledger_volume.py'
      - 'src/lightyear_factory/intcalc_preview_transport.py'
      - 'tools/intcalc_attended_freeze.py'
      - 'tools/qualify_intcalc_attended_freeze.py'
      - src/lightyear_mainframe/intcalc_retirement.py
      - spec/intcalc-retirement/**
      - tests/test_intcalc_retirement.py
      - '.github/workflows/intcalc-c1-public.yml'
      - 'src/lightyear_mainframe/**'
      - 'src/carddemo_oracle/**'
      - 'src/lightyear_common/**'
      - 'spec/mainframe/**'
      - 'spec/comparison-normalizations.json'
      - 'tests/mainframe/fixtures/**'
      - 'tests/test_intcalc_candidate_gate.py'
      - 'tests/fixtures/intcalc-c1/**'
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.ref == 'refs/heads/main' && github.run_id || 'branch' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  oracle-freeze:
    name: Retired verifier refusal proof (NOT QUALIFICATION)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Retirement negatives; no cases, freeze, images or execution
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then export PYTHONPATH='src;.;tests'; else export PYTHONPATH=src:.:tests; fi
          python -B -m unittest test_intcalc_retirement
      - name: Explicit retired state, never new qualification
        shell: bash
        run: echo 'RETIRED_NOT_QUALIFIED; no case fetch, freeze, candidate or model executed'
