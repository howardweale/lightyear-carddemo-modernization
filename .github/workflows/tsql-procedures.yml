name: T-SQL public corpus offline checks
on:
  pull_request:
    paths:
      - 'src/lightyear_data/tsql_procedures/**'
      - 'data-modernization/tsql-procedures/**'
      - 'tools/tsql_scriptdom/**'
      - 'tools/*tsql_native.py'
      - 'tests/test_tsql*.py'
      - '.github/workflows/tsql-procedures.yml'
  push:
    branches: [main]
    paths:
      - 'src/lightyear_data/tsql_procedures/**'
      - 'data-modernization/tsql-procedures/**'
      - 'tools/tsql_scriptdom/**'
      - 'tools/*tsql_native.py'
      - 'tests/test_tsql*.py'
      - '.github/workflows/tsql-procedures.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.ref == 'refs/heads/main' && github.run_id || 'branch' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[control-tower,tsql]'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore tools/tsql_scriptdom/TsqlInventory.csproj --locked-mode
      - run: dotnet build tools/tsql_scriptdom/TsqlInventory.csproj --no-restore -o work/tsql-ci-bridge
      - name: Public-fixture tests; no database or model calls
        env:
          TSQL_BRIDGE: work/tsql-ci-bridge/TsqlInventory.dll
        run: python -B -m unittest discover -s tests -p 'test_tsql*.py' -v
