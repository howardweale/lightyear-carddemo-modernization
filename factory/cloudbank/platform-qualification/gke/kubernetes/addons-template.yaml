apiVersion: v1
kind: Namespace
metadata:
  name: "{{MODEL_NAMESPACE}}"
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    environment: non-production
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ollama
  namespace: "{{MODEL_NAMESPACE}}"
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: "{{MODEL_NAMESPACE}}"
  labels:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/part-of: cloudbank-model
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama
        app.kubernetes.io/part-of: cloudbank-model
      annotations:
        lightyear.ai/model-name: "{{OLLAMA_MODEL_NAME}}"
        lightyear.ai/model-manifest-sha256: "{{OLLAMA_MODEL_MANIFEST_SHA256}}"
    spec:
      serviceAccountName: ollama
      automountServiceAccountToken: false
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: ollama
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: ollama
        image: "{{OLLAMA_MODEL_IMAGE}}"
        imagePullPolicy: IfNotPresent
        env:
        - {name: HOME, value: /tmp/ollama-home}
        - {name: OLLAMA_HOST, value: 0.0.0.0:11434}
        - {name: OLLAMA_MODELS, value: /models}
        - {name: OLLAMA_NOHISTORY, value: "1"}
        - {name: OLLAMA_KEEP_ALIVE, value: "0"}
        - {name: OLLAMA_NUM_PARALLEL, value: "1"}
        ports:
        - {name: http, containerPort: 11434}
        startupProbe:
          httpGet: {path: /api/tags, port: http}
          failureThreshold: 60
          periodSeconds: 5
        livenessProbe:
          httpGet: {path: /, port: http}
          periodSeconds: 15
          timeoutSeconds: 3
        readinessProbe:
          httpGet: {path: /api/tags, port: http}
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          requests:
            cpu: 500m
            memory: 768Mi
          limits:
            cpu: "2"
            memory: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - {name: tmp, mountPath: /tmp}
      volumes:
      - name: tmp
        emptyDir: {sizeLimit: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: "{{MODEL_NAMESPACE}}"
spec:
  selector:
    app.kubernetes.io/name: ollama
  ports:
  - {name: http, port: 11434, targetPort: http}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ollama
  namespace: "{{MODEL_NAMESPACE}}"
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: model-default-deny
  namespace: "{{MODEL_NAMESPACE}}"
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chatbot-only-model-ingress
  namespace: "{{MODEL_NAMESPACE}}"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ollama
  policyTypes: ["Ingress"]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: "{{NAMESPACE}}"
      podSelector:
        matchLabels:
          app.kubernetes.io/name: chatbot
    ports:
    - {protocol: TCP, port: 11434}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chatbot-in-cluster-model-egress
  namespace: "{{NAMESPACE}}"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: chatbot
  policyTypes: ["Egress"]
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: "{{MODEL_NAMESPACE}}"
      podSelector:
        matchLabels:
          app.kubernetes.io/name: ollama
    ports:
    - {protocol: TCP, port: 11434}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: cloudbank-ms67-letsencrypt
spec:
  acme:
    email: "{{LETSENCRYPT_EMAIL}}"
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: cloudbank-ms67-acme
    solvers:
    - http01:
        ingress:
          ingressClassName: nginx
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudbank
  namespace: "{{NAMESPACE}}"
  annotations:
    cert-manager.io/cluster-issuer: cloudbank-ms67-letsencrypt
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - "{{TLS_HOSTNAME}}"
    secretName: cloudbank-ms67-tls
  rules:
  - host: "{{TLS_HOSTNAME}}"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: testrunner
            port:
              number: 8080
---
