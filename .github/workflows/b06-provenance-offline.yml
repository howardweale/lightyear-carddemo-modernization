name: B06 portable provenance regressions
on:
  pull_request:
    paths:
      - 'tools/b06_host_probe/**'
      - 'tools/b06_image_artifacts/**'
      - 'tools/ms94_b06_*.py'
      - 'tools/*.ps1'
      - 'factory/idempiere/b06-observer/**'
      - 'tests/b06_synthetic_classfiles.py'
      - 'tests/test_b06_*.py'
      - 'tests/test_ms94_b06_*.py'
      - '.github/workflows/b06-provenance-offline.yml'
      - 'src/lightyear_factory/transport_journal.py'
      - 'src/lightyear_factory/controller_count_accounting.py'
      - 'src/lightyear_factory/count_charge_account.py'
      - 'src/lightyear_factory/count_request_bound.py'
      - 'src/lightyear_factory/flex_billing.py'
      - 'src/lightyear_execution/human_drill_dispatch.py'
      - 'src/lightyear_execution/public_drill_outputs.py'
      - 'src/lightyear_execution/public_drill_runtime.py'
      - 'src/lightyear_execution/tower_drill_admission.py'
      - 'src/lightyear_execution/tower_drill_context.py'
      - 'src/lightyear_execution/tower_drill_reservation.py'
      - 'src/lightyear_execution/tower_drill_roles.py'
  push:
    branches: [main]
    paths:
      - 'tools/b06_host_probe/**'
      - 'tools/b06_image_artifacts/**'
      - 'tools/ms94_b06_*.py'
      - 'tools/*.ps1'
      - 'factory/idempiere/b06-observer/**'
      - 'tests/b06_synthetic_classfiles.py'
      - 'tests/test_b06_*.py'
      - 'tests/test_ms94_b06_*.py'
      - '.github/workflows/b06-provenance-offline.yml'
      - 'src/lightyear_factory/transport_journal.py'
      - 'src/lightyear_factory/controller_count_accounting.py'
      - 'src/lightyear_factory/count_charge_account.py'
      - 'src/lightyear_factory/count_request_bound.py'
      - 'src/lightyear_factory/flex_billing.py'
      - 'src/lightyear_execution/human_drill_dispatch.py'
      - 'src/lightyear_execution/public_drill_outputs.py'
      - 'src/lightyear_execution/public_drill_runtime.py'
      - 'src/lightyear_execution/tower_drill_admission.py'
      - 'src/lightyear_execution/tower_drill_context.py'
      - 'src/lightyear_execution/tower_drill_reservation.py'
      - 'src/lightyear_execution/tower_drill_roles.py'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.ref == 'refs/heads/main' && github.run_id || 'branch' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  synthetic:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[control-tower]'
      - name: Authored fixtures; no local JDI evidence, Docker or models
        shell: bash
        run: |
          set -e
          python -B -m unittest discover -s tests -p 'test_b06_*.py' -v
          python -B -m unittest discover -s tests -p 'test_ms94_b06_*.py' -v
