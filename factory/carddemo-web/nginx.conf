server {
  listen 80;
  root /usr/share/nginx/html;
  location /api/ { proxy_pass http://service:8080; proxy_read_timeout 30s; }
  location = /not-in-this-slice { proxy_pass http://service:8080; }
  location / { try_files $uri $uri/ /index.html; }
  add_header Cache-Control "no-store" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'" always;
}
