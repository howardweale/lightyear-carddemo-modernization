steps:
- id: checkout-pinned-controller
  name: gcr.io/cloud-builders/git
  entrypoint: /bin/bash
  args:
  - -ceu
  - |
    [[ "${_SOURCE_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
    git init /workspace/source
    git -C /workspace/source remote add origin \
      https://github.com/howardweale/lightyear-carddemo-modernization.git
    git -C /workspace/source fetch --depth=1 origin "${_SOURCE_COMMIT}"
    git -C /workspace/source checkout --detach FETCH_HEAD
    [[ "$$(git -C /workspace/source rev-parse HEAD)" == "${_SOURCE_COMMIT}" ]]
- id: checkout-pinned-cloudbank
  name: gcr.io/cloud-builders/git
  entrypoint: /bin/bash
  args:
  - -ceu
  - |
    git init /workspace/upstream
    git -C /workspace/upstream remote add origin https://github.com/oracle/microservices-backend.git
    git -C /workspace/upstream sparse-checkout init --cone
    git -C /workspace/upstream sparse-checkout set cloudbank-v5
    git -C /workspace/upstream fetch --depth=1 origin 4f41b16d00c45503f691836fee8138010c969e86
    git -C /workspace/upstream checkout --detach FETCH_HEAD
    [[ "$$(git -C /workspace/upstream rev-parse HEAD)" == "4f41b16d00c45503f691836fee8138010c969e86" ]]
    [[ "$$(git -C /workspace/upstream rev-parse 'HEAD^{tree}')" == "6aa92e89c783f123c4da8d7ae18108004a4f4a99" ]]
    [[ "$$(git -C /workspace/upstream rev-parse 'HEAD:cloudbank-v5')" == "bd918386209f284a1ed31802555740eb34b75348" ]]
- id: run-ms65-rehearsal
  name: gcr.io/google.com/cloudsdktool/google-cloud-cli:573.0.0
  waitFor:
  - checkout-pinned-controller
  - checkout-pinned-cloudbank
  entrypoint: /bin/bash
  env:
  - CLOUDSDK_CORE_PROJECT=$PROJECT_ID
  - KUBECONFIG=/workspace/ms65-kubeconfig
  secretEnv:
  - LIGHTYEAR_CLOUDBANK_BASELINE_EVIDENCE_KEY
  args:
  - -ceu
  - |
    trap 'rm -f /workspace/ms65-kubeconfig' EXIT
    mkdir -p /workspace/inputs
    fetch_input() {
      local uri="$$1" digest="$$2" output="$$3"
      [[ "$$digest" =~ ^[0-9a-f]{64}$ ]]
      gcloud storage cp "$$uri" "$$output" --project "$PROJECT_ID"
      printf '%s  %s\n' "$$digest" "$$output" | sha256sum --check -
    }
    fetch_input "${_IMAGE_LOCK_URI}" "${_IMAGE_LOCK_SHA256}" /workspace/inputs/image-lock.json
    fetch_input "${_MS64_RECEIPT_URI}" "${_MS64_RECEIPT_SHA256}" /workspace/inputs/ms64-receipt.json
    fetch_input "${_MS65_ENVIRONMENT_URI}" "${_MS65_ENVIRONMENT_SHA256}" /workspace/inputs/ms65-environment.json
    fetch_input "${_JOURNEYS_URI}" "${_JOURNEYS_SHA256}" /workspace/inputs/journeys.json
    fetch_input "${_DATABASE_RECOVERY_URI}" "${_DATABASE_RECOVERY_SHA256}" /workspace/inputs/database-recovery.json
    gcloud container clusters get-credentials "${_CLUSTER}" \
      --region "${_REGION}" --dns-endpoint --project "$PROJECT_ID"
    command -v kubectl >/dev/null
    command -v python3 >/dev/null
    command -v git >/dev/null
    command -v gke-gcloud-auth-plugin >/dev/null
    python3 -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 11) else 1)'
    cd /workspace/source
    export LIGHTYEAR_PYTHON=python3
    export LIGHTYEAR_NON_PRODUCTION_ACK=I-AUTHORIZE-MS67-NON-PRODUCTION-MUTATIONS
    bash ./cloudbank-ms65-rehearsal.sh run \
      --project "$PROJECT_ID" \
      --region "${_REGION}" \
      --cluster "${_CLUSTER}" \
      --namespace "${_NAMESPACE}" \
      --source-root /workspace/upstream \
      --image-lock /workspace/inputs/image-lock.json \
      --ms64-receipt /workspace/inputs/ms64-receipt.json \
      --environment /workspace/inputs/ms65-environment.json \
      --journeys /workspace/inputs/journeys.json \
      --database-recovery /workspace/inputs/database-recovery.json \
      --output-root "/workspace/ms65-rehearsal-$BUILD_ID" \
      --evidence-bucket "${_EVIDENCE_BUCKET_PREFIX}" \
      --signer "${_SIGNER}" \
      --run-id "ms65-$BUILD_ID"
availableSecrets:
  secretManager:
  - versionName: projects/$PROJECT_ID/secrets/${_EVIDENCE_SECRET}/versions/latest
    env: LIGHTYEAR_CLOUDBANK_BASELINE_EVIDENCE_KEY
options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: '30'
  logging: CLOUD_LOGGING_ONLY
tags:
- ms67-ms65-rehearsal
timeout: 3600s
