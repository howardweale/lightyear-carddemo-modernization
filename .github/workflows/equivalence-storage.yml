name: Equivalence byte storage
on:
  pull_request:
    paths:
      - 'src/lightyear_mainframe/equivalence_storage.py'
      - 'src/lightyear_mainframe/equivalence_dataflow.py'
      - 'src/lightyear_mainframe/source.py'
      - 'src/lightyear_mainframe/records.py'
      - 'tools/inspect_equivalence_storage.py'
      - 'tests/test_equivalence_storage.py'
      - 'tests/test_equivalence_dataflow.py'
      - '.github/workflows/equivalence-storage.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: equivalence-storage-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Byte alias, group MOVE and unsupported-gate tests
        env:
          PYTHONPATH: src:.:tests
        run: python -B -m unittest test_equivalence_storage test_equivalence_dataflow test_records -v
      - name: Translate requested public program storage twice
        env:
          PYTHONPATH: src:.
          EQUIVALENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -B -m tools.inspect_equivalence_storage work/equivalence-storage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: equivalence-storage-diagnostics
          path: work/equivalence-storage
          retention-days: 30
