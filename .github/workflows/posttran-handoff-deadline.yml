name: POSTTRAN handoff deadline and documentation
on:
  schedule:
    - cron: '46 14 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'docs/factory/**'
      - 'tools/check_posttran_handoff.py'
      - 'tools/check_posttran_deadline.py'
      - 'tools/check_runbook_variables.ps1'
      - 'tools/check_posttran_plan_artifact.py'
      - 'tests/test_posttran_handoff.py'
      - 'tests/test_posttran_handoff_followups.py'
      - 'tests/test_phase2_authorization.py'
      - '.github/workflows/posttran-handoff-deadline.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.run_id }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  handoff-regressions:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'cryptography>=46,<47'
      - name: Test deadline, documented refs, amendment and public-key bindings
        shell: pwsh
        env:
          PYTHONPATH: 'src;.;tests'
        run: python -B -m unittest test_posttran_handoff test_posttran_handoff_followups test_phase2_authorization -v
      - name: Compare original CI plan with declared amendment
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: 'src;.'
        run: python -B -m tools.check_posttran_plan_artifact
      - name: Lint standalone current PowerShell runbook blocks
        shell: pwsh
        run: ./tools/check_runbook_variables.ps1
  deadline:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    concurrency:
      group: posttran-deadline-issue
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m pip install 'cryptography>=46,<47'
      - name: Evaluate real UTC clock and maintain one warning issue
        env:
          PYTHONPATH: src:.
          GH_TOKEN: ${{ github.token }}
        run: python3 -B -m tools.check_posttran_deadline --issue-repository '${{ github.repository }}'
