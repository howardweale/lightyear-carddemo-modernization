name: C2 composition synthetic checks
on:
  pull_request:
    paths:
      - 'src/lightyear_mainframe/__init__.py'
      - src/lightyear_mainframe/intcalc_retirement.py
      - spec/intcalc-retirement/**
      - tests/test_intcalc_retirement.py
      - 'src/lightyear_factory/intcalc_preview_composition.py'
      - 'src/lightyear_factory/__init__.py'
      - 'spec/intcalc-preview/2026-11-14/RUN1-REFUSAL-OUTPUT-FIX.json'
      - 'src/lightyear_factory/intcalc_preview_transport.py'
      - 'tools/check_intcalc_public_role_bounds.py'
      - 'tests/test_intcalc_preview_composition.py'
      - 'tests/fixtures/intcalc-preview/provider-envelope.json'
      - 'spec/intcalc-preview/2026-11-12/COMPOSITION-IMPLEMENTATION.json'
      - 'spec/intcalc-preview/2026-11-13/COMPOSITION-E2-BUDGET.json'
      - 'spec/intcalc-preview/2026-11-13/COMPOSITION-E2-IMPLEMENTATION.json'
      - '.github/workflows/intcalc-preview-composition.yml'
      - 'tools/ci/github_read_budget.py'
      - 'tools/ci/workflow_release_inputs.py'
      - 'tests/test_workflow_release_inputs.py'
  push:
    branches: [main]
    paths:
      - 'src/lightyear_mainframe/__init__.py'
      - src/lightyear_mainframe/intcalc_retirement.py
      - spec/intcalc-retirement/**
      - tests/test_intcalc_retirement.py
      - 'src/lightyear_factory/intcalc_preview_composition.py'
      - 'src/lightyear_factory/__init__.py'
      - 'spec/intcalc-preview/2026-11-14/RUN1-REFUSAL-OUTPUT-FIX.json'
      - 'src/lightyear_factory/intcalc_preview_transport.py'
      - 'tools/check_intcalc_public_role_bounds.py'
      - 'tests/test_intcalc_preview_composition.py'
      - 'tests/fixtures/intcalc-preview/provider-envelope.json'
      - 'spec/intcalc-preview/2026-11-12/COMPOSITION-IMPLEMENTATION.json'
      - 'spec/intcalc-preview/2026-11-13/COMPOSITION-E2-BUDGET.json'
      - 'spec/intcalc-preview/2026-11-13/COMPOSITION-E2-IMPLEMENTATION.json'
      - '.github/workflows/intcalc-preview-composition.yml'
      - 'tools/ci/github_read_budget.py'
      - 'tools/ci/workflow_release_inputs.py'
      - 'tests/test_workflow_release_inputs.py'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.ref == 'refs/heads/main' && github.run_id || 'branch' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  release-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    outputs:
      artifact_id: ${{ steps.retain.outputs.artifact-id }}
      producer_attempt: ${{ steps.fetch.outputs.producer_attempt }}
    steps:
      - name: Record GitHub quota at job start
        timeout-minutes: 1
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          QUOTA_PHASE: start
        run: &quota_sample |
          python -I -B - <<'PY'
          import datetime, os, re, subprocess
          from pathlib import Path

          sample = "status=unavailable"
          try:
              p = subprocess.run(["gh", "api", "--include", "rate_limit", "--hostname", "github.com"], capture_output=True,
                                 check=False, timeout=12)
              header, boundary, _ = p.stdout.replace(b"\r\n", b"\n").partition(b"\n\n")
              if p.returncode == 0 and boundary and len(header) <= 16384:
                  values = {}
                  for key in ("used", "remaining", "reset", "resource"):
                      token = rb"[a-z_]+" if key == "resource" else rb"[0-9]{1,20}"
                      pattern = rb"^x-ratelimit-" + key.encode() + rb":[ \t]*(" + token + rb")[ \t]*$"
                      matches = re.findall(pattern, header, re.IGNORECASE | re.MULTILINE)
                      if len(matches) == 1:
                          values[key] = matches[0].decode("ascii").lower()
                  if all(k in values for k in ("used", "remaining", "reset")):
                      sample = ("status=observed used={used} remaining={remaining} reset={reset} "
                                "resource={resource}").format(**{"resource":"unknown", **values})
          except (OSError, subprocess.TimeoutExpired):
              pass
          now = datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds")
          line = ("github-quota " + now + " phase=" + os.environ["QUOTA_PHASE"] +
                  " job=" + os.environ["GITHUB_JOB"] + " os=" + os.environ["RUNNER_OS"] +
                  " arch=" + os.environ["RUNNER_ARCH"] + " run=" + os.environ["GITHUB_RUN_ID"] +
                  " attempt=" + os.environ["GITHUB_RUN_ATTEMPT"] + " " + sample)
          print(line)
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as f:
              f.write(line + "\n")
          PY
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Synthetic pinned-input and read-budget contract
        run: python -B -m unittest discover -s tests -p test_workflow_release_inputs.py -v
      - name: Fetch and verify pinned public Release bytes
        id: fetch
        timeout-minutes: 3
        shell: bash
        run: python -B -m tools.ci.workflow_release_inputs produce composition "$RUNNER_TEMP/pinned-release"
      - uses: actions/upload-artifact@v7
        id: retain
        with:
          name: pinned-composition-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pinned-release
          if-no-files-found: error
          retention-days: 30
      - name: Record GitHub quota at job end
        if: always()
        timeout-minutes: 1
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          QUOTA_PHASE: end
        run: *quota_sample
  composition-synthetic:
    needs: release-inputs
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Record GitHub quota at job start
        timeout-minutes: 1
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          QUOTA_PHASE: start
        run: *quota_sample
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check producer identity
        shell: bash
        env:
          INPUT_ARTIFACT_ID: ${{ needs.release-inputs.outputs.artifact_id }}
          INPUT_PRODUCER_ATTEMPT: ${{ needs.release-inputs.outputs.producer_attempt }}
        run: python -B -m tools.ci.workflow_release_inputs precheck composition "$RUNNER_TEMP/pinned-release"
      - name: Retrieve exact run-scoped public inputs
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.release-inputs.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/pinned-release
      - name: Verify producer receipt and current pinned bytes
        shell: bash
        env:
          INPUT_ARTIFACT_ID: ${{ needs.release-inputs.outputs.artifact_id }}
          INPUT_PRODUCER_ATTEMPT: ${{ needs.release-inputs.outputs.producer_attempt }}
        run: python -B -m tools.ci.workflow_release_inputs verify composition "$RUNNER_TEMP/pinned-release"
      - name: Hash-pinned public context projection regression; no provider
        shell: bash
        run: |
          context_dir="$RUNNER_TEMP/pinned-release"
          if [ "$RUNNER_OS" = Windows ]; then export PYTHONPATH='src;.;tests'; else export PYTHONPATH='src:.:tests'; fi
          python -B tools/check_intcalc_public_role_bounds.py --archive "$context_dir/MODEL-CONTEXT.zip" --allowlist "$context_dir/MODEL-ALLOWLIST.json"
      - name: Synthetic composition tests without provider or runtime access
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            export PYTHONPATH='src;.;tests'
          else
            export PYTHONPATH='src:.:tests'
          fi
          python -B - <<'PY'
          import socket,subprocess,unittest
          from unittest.mock import patch
          import test_intcalc_preview_composition
          suite=unittest.defaultTestLoader.loadTestsFromModule(test_intcalc_preview_composition)
          with patch.object(socket.socket,'connect',side_effect=AssertionError('No network')), patch.object(subprocess,'Popen',side_effect=AssertionError('No child runtime')):
              result=unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful() and not result.skipped and result.testsRun==92
          PY
      - name: Record GitHub quota at job end
        if: always()
        timeout-minutes: 1
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          QUOTA_PHASE: end
        run: *quota_sample
  historical-namespace-negative:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Record GitHub quota at job start
        timeout-minutes: 1
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          QUOTA_PHASE: start
        run: *quota_sample
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Write synthetic preview result
        shell: bash
        env:
          PYTHONPATH: src:.:tests
        run: |
          python -B - <<'PY'
          from pathlib import Path
          from unittest.mock import patch
          from lightyear_factory import intcalc_preview_composition as c
          from test_intcalc_preview_composition import FakePorts,packet,PUBLIC,ALLOWLIST
          # Historical synthetic result only; no provider, candidate or admission.
          with patch.object(c.retirement,'require_current'),patch.object(c,'CONTEXT_HASH',c.digest(PUBLIC)),patch.object(c,'ALLOWLIST_HASH',c.digest(ALLOWLIST)):
              ports=FakePorts()
              result=c.Composition(packet(),PUBLIC,ALLOWLIST,ports,clock=lambda:ports.now).run()
          c.verify_result(result)
          output=Path('synthetic-preview-result')
          output.mkdir(exist_ok=False)
          (output/'summary.json').write_bytes(c.canonical(result))
          assert c.main(['verify','--qualify'])==2
          PY
      - uses: actions/checkout@v7
        with:
          ref: b123faed16ab372f4feb07d2ddb33c002d07a4d8
          path: historical-qualifier
      - name: Import exact historical qualifier and require False
        shell: bash
        working-directory: historical-qualifier
        env:
          PYTHONPATH: src:.
        run: |
          python -B - <<'PY'
          import hashlib,socket,subprocess
          from pathlib import Path
          from unittest.mock import patch
          source=Path('tools/ci/p5_drills.py').read_bytes()
          assert hashlib.sha256(source).hexdigest()=='2e29fa748274d7386a9fe7676088f1c5f9e1107deb8f7992c2372a9017f6d9cd'
          with patch.object(socket.socket,'connect',side_effect=AssertionError('No network')), patch.object(subprocess,'Popen',side_effect=AssertionError('No runtime')):
              from tools.ci.p5_drills import qualify
              assert qualify(Path('../synthetic-preview-result')) is False
          PY
      - name: Record GitHub quota at job end
        if: always()
        timeout-minutes: 1
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          QUOTA_PHASE: end
        run: *quota_sample
