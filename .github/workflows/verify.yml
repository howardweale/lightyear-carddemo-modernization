name: Verify oracle and Spring Batch candidate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pli-build-attestation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Build and verify bounded PL/I candidate evidence
        run: ./pli-build-attestation.sh ci-build

      - name: Generate workload-identity build provenance
        uses: actions/attest@v4
        with:
          subject-path: work/pli-build-attestation-ci-build/pli-auth-risk-candidate.jar

      - name: Generate workload-identity SBOM attestation
        uses: actions/attest@v4
        with:
          subject-path: work/pli-build-attestation-ci-build/pli-auth-risk-candidate.jar
          sbom-path: work/pli-build-attestation-ci-build/sbom.cdx.json

      - name: Publish attested build evidence
        uses: actions/upload-artifact@v4
        with:
          name: pli-build-attestation-${{ github.sha }}
          path: work/pli-build-attestation-ci-build/
          if-no-files-found: error

  verifier-escape-gauntlet:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Attack verifier and holdout boundaries
        if: runner.os == 'Linux'
        run: ./verifier-gauntlet.sh

      - name: Attack verifier and holdout boundaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\verifier-gauntlet.ps1

  differential-verification:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Check out pinned CardDemo source
        shell: bash
        run: |
          git -c core.autocrlf=false -c core.eol=lf clone --filter=blob:none --no-checkout https://github.com/aws-samples/aws-mainframe-modernization-carddemo.git ../carddemo-upstream
          git -C ../carddemo-upstream -c core.autocrlf=false -c core.eol=lf checkout --detach 59cc6c2fd7ebd7ef7925cad552a01a4b8b6e4d5e

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: candidate-java/pom.xml

      - name: Run unit and differential verification
        if: runner.os == 'Linux'
        run: ./verify.sh

      - name: Run unit and differential verification (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\verify.ps1

      - name: Reject verification that mutates tracked evidence
        run: git diff --exit-code
