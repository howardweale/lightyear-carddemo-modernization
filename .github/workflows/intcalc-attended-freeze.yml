name: INTCALC attended-freeze retirement boundary
on:
  pull_request:
    paths:
      - src/lightyear_mainframe/intcalc_retirement.py
      - spec/intcalc-retirement/**
      - tests/test_intcalc_retirement.py
      - 'src/**'
      - 'spec/**'
      - 'tools/**'
      - 'tests/test_intcalc_attended_freeze.py'
      - 'tests/fixtures/intcalc-c1/Main.java'
      - '.github/workflows/intcalc-attended-freeze.yml'
  push:
    branches: [main]
    paths:
      - src/lightyear_mainframe/intcalc_retirement.py
      - spec/intcalc-retirement/**
      - tests/test_intcalc_retirement.py
      - 'src/**'
      - 'spec/**'
      - 'tools/**'
      - 'tests/test_intcalc_attended_freeze.py'
      - 'tests/fixtures/intcalc-c1/Main.java'
      - '.github/workflows/intcalc-attended-freeze.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.run_id }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  attended-freeze-synthetic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Synthetic admission and joins; no oracle or bundle
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then export PYTHONPATH='src;.;tests'; else export PYTHONPATH=src:.:tests; fi
          python -B -m unittest test_intcalc_attended_freeze
      - name: Retired source admission refuses before inspection
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export PYTHONPATH=src:.
          python -B - <<'PY'
          import os,subprocess,sys
          result=subprocess.run([sys.executable,'-B','-m','tools.qualify_intcalc_attended_freeze','--source',os.environ['GITHUB_WORKSPACE'],'--source-admission-only'],stdin=subprocess.DEVNULL,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=30)
          assert result.returncode==2, 'retirement-exit'
          assert result.stdout==b'retired-verifier-set\n', 'retirement-stdout'
          assert result.stderr==b'', 'retirement-stderr'
          print('retired-source-admission-refusal-match')
          PY
  attended-freeze-equivalence:
    name: Retired verifier refusal proof (NOT QUALIFICATION)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Retirement negatives; no cases, freeze, images or execution
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then export PYTHONPATH='src;.;tests'; else export PYTHONPATH=src:.:tests; fi
          python -B -m unittest test_intcalc_retirement
      - name: Explicit retired state, never new qualification
        shell: bash
        run: echo 'RETIRED_NOT_QUALIFIED; no case fetch, freeze, candidate or model executed'
