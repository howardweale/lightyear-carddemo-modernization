name: CardDemo web slice
on:
  pull_request:
    paths: ['factory/carddemo-web/**', 'src/lightyear_data/carddemo/**', 'src/lightyear_mainframe/records.py', 'spec/modernization/carddemo-screens/**', 'spec/modernization/carddemo-data/**', 'tests/test_carddemo_web*', 'tests/browser/carddemo-slice.mjs', '.github/workflows/carddemo-web.yml']
  push:
    branches: [main]
    paths: ['factory/carddemo-web/**', 'src/lightyear_data/carddemo/**', 'src/lightyear_mainframe/records.py', 'spec/modernization/carddemo-screens/**', 'spec/modernization/carddemo-data/**', 'tests/test_carddemo_web*', 'tests/browser/carddemo-slice.mjs', '.github/workflows/carddemo-web.yml']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.ref == 'refs/heads/main' && github.run_id || 'branch' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  source-and-service-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Render status metadata for review
        env:
          PYTHONPATH: src:.
        run: |
          python -B tools/build_factory_current_status.py
          mkdir -p work/carddemo-status-render
          cp docs/factory/current-status.json docs/factory/current-status.md work/carddemo-status-render/
      - uses: actions/upload-artifact@v7
        with:
          name: carddemo-status-render
          path: work/carddemo-status-render
          if-no-files-found: error
      - name: Derive six-screen bindings and linked data dependencies
        env:
          PYTHONPATH: src:tests
        run: |
          python -B -m unittest test_carddemo_web_bindings test_carddemo_web_reference -v
          python -B -m lightyear_data.carddemo.web_bindings --out work/carddemo-web-bindings
          python -B -m lightyear_data.carddemo.plan --out work/carddemo-web-data
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile Java services and test generated bindings and disposable session tokens
        run: mvn -B -f factory/carddemo-web/service/pom.xml -Dcarddemo.root="$GITHUB_WORKSPACE" test
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Typecheck and compile the model-driven TypeScript UI
        run: |
          npm ci --prefix factory/carddemo-web/ui --ignore-scripts --no-audit --no-fund
          npm run build --prefix factory/carddemo-web/ui
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: carddemo-web-foundation
          path: |
            work/carddemo-web-bindings
            work/carddemo-web-data
            factory/carddemo-web/service/target/surefire-reports
            factory/carddemo-web/ui/dist
          if-no-files-found: error

  compose-smoke:
    needs: source-and-service-foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Build and start disposable six-screen application
        run: docker compose -f factory/carddemo-web/compose.yaml -f factory/carddemo-web/compose.ci.yaml up -d --build
      - name: Wait for generated public and synthetic fixture
        run: |
          mkdir -p work/carddemo-compose
          for i in $(seq 1 120); do
            if docker compose -f factory/carddemo-web/compose.yaml cp seed:/fixture/fixture.json work/carddemo-compose/fixture.json; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Exercise six-screen API journey and atomic fraud toggle
        run: python -B factory/carddemo-web/runtime/smoke.py --fixture work/carddemo-compose/fixture.json --out work/carddemo-compose/api
      - name: Compare sign-on and menu with independently interpreted pinned COBOL
        env:
          PYTHONPATH: src
        run: python -B factory/carddemo-web/runtime/prove_signon.py --out work/carddemo-compose/reference-signon
      - name: Install browser from the existing locked CI dependency
        run: |
          npm ci --prefix tests/browser --ignore-scripts --no-audit --no-fund
          cd tests/browser
          npx --no-install playwright install --with-deps chromium
      - name: Compare rendered browser fields with every service response
        env:
          CARDDEMO_FIXTURE: work/carddemo-compose/fixture.json
          CARDDEMO_BROWSER_OUT: work/carddemo-compose/browser
          CARDDEMO_REFERENCE_SIGNON: work/carddemo-compose/reference-signon/cases.json
        run: node tests/browser/carddemo-slice.mjs
      - name: Preserve runtime diagnostics
        if: always()
        run: |
          mkdir -p work/carddemo-compose
          docker compose -f factory/carddemo-web/compose.yaml ps -a > work/carddemo-compose/containers.txt
          docker compose -f factory/carddemo-web/compose.yaml logs --no-color > work/carddemo-compose/runtime.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: carddemo-compose-smoke
          path: work/carddemo-compose
          if-no-files-found: error
