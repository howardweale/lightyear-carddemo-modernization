name: C2 build-gate-adapter qualification
on:
  pull_request:
    paths:
      - '.github/workflows/intcalc-preview-build-gate-adapter.yml'
      - 'spec/intcalc-preview/2026-11-13/BUILD-GATE-ADAPTER-IMPLEMENTATION-R3.json'
      - 'spec/intcalc-preview/2026-11-13/COMPILATION-FEEDBACK-NAMED-LIMIT.json'
      - 'spec/intcalc-preview/2026-11-13/COMPILATION-FEEDBACK-SCHEMA.json'
      - 'src/carddemo_oracle/__init__.py'
      - 'src/carddemo_oracle/compare.py'
      - 'src/carddemo_oracle/records.py'
      - 'src/lightyear_common/__init__.py'
      - 'src/lightyear_common/io.py'
      - 'src/lightyear_common/trust.py'
      - 'src/lightyear_factory/__init__.py'
      - 'src/lightyear_factory/intcalc_preview_build_gate.py'
      - 'src/lightyear_factory/intcalc_preview_build_gate_worker.py'
      - 'src/lightyear_factory/intcalc_preview_composition.py'
      - 'src/lightyear_factory/intcalc_preview_transport.py'
      - 'src/lightyear_mainframe/__init__.py'
      - 'src/lightyear_mainframe/intcalc_candidate_gate.py'
      - 'src/lightyear_mainframe/public_dataset_diff.py'
      - 'src/lightyear_mainframe/records.py'
      - 'src/lightyear_mainframe/source.py'
      - 'src/lightyear_mainframe/zos_bindings.py'
      - 'tests/fixtures/intcalc-c1/Main.java'
      - 'tests/test_intcalc_preview_build_gate.py'
      - 'tests/test_intcalc_preview_compile_feedback.py'
      - 'tests/test_intcalc_preview_composition.py'
      - 'tools/qualify_intcalc_preview_build_gate.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/intcalc-preview-build-gate-adapter.yml'
      - 'spec/intcalc-preview/2026-11-13/BUILD-GATE-ADAPTER-IMPLEMENTATION-R3.json'
      - 'spec/intcalc-preview/2026-11-13/COMPILATION-FEEDBACK-NAMED-LIMIT.json'
      - 'spec/intcalc-preview/2026-11-13/COMPILATION-FEEDBACK-SCHEMA.json'
      - 'src/carddemo_oracle/__init__.py'
      - 'src/carddemo_oracle/compare.py'
      - 'src/carddemo_oracle/records.py'
      - 'src/lightyear_common/__init__.py'
      - 'src/lightyear_common/io.py'
      - 'src/lightyear_common/trust.py'
      - 'src/lightyear_factory/__init__.py'
      - 'src/lightyear_factory/intcalc_preview_build_gate.py'
      - 'src/lightyear_factory/intcalc_preview_build_gate_worker.py'
      - 'src/lightyear_factory/intcalc_preview_composition.py'
      - 'src/lightyear_factory/intcalc_preview_transport.py'
      - 'src/lightyear_mainframe/__init__.py'
      - 'src/lightyear_mainframe/intcalc_candidate_gate.py'
      - 'src/lightyear_mainframe/public_dataset_diff.py'
      - 'src/lightyear_mainframe/records.py'
      - 'src/lightyear_mainframe/source.py'
      - 'src/lightyear_mainframe/zos_bindings.py'
      - 'tests/fixtures/intcalc-c1/Main.java'
      - 'tests/test_intcalc_preview_build_gate.py'
      - 'tests/test_intcalc_preview_compile_feedback.py'
      - 'tests/test_intcalc_preview_composition.py'
      - 'tools/qualify_intcalc_preview_build_gate.py'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.run_id }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  synthetic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Synthetic tests; no providers or Docker
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then export PYTHONPATH='src;.;tests'; else export PYTHONPATH='src:.:tests'; fi
          python -B - <<'PY'
          import socket, subprocess, sys, unittest
          from unittest.mock import patch
          import test_intcalc_preview_build_gate, test_intcalc_preview_compile_feedback
          original = subprocess.Popen
          def synthetic_only(argv, *args, **kwargs):
              if not isinstance(argv, list) or argv[:3] != [sys.executable, '-I', '-c'] or len(argv) != 4:
                  raise AssertionError('Only fixed synthetic children allowed')
              if argv[3] not in ('print("synthetic")', 'import time; time.sleep(20)'):
                  raise AssertionError('Unknown synthetic child')
              return original(argv, *args, **kwargs)
          suite = unittest.TestSuite([unittest.defaultTestLoader.loadTestsFromModule(test_intcalc_preview_build_gate), unittest.defaultTestLoader.loadTestsFromModule(test_intcalc_preview_compile_feedback)])
          with patch.object(socket.socket, 'connect', side_effect=AssertionError('No network')), patch.object(subprocess, 'Popen', side_effect=synthetic_only):
              result = unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful() and not result.skipped and result.testsRun == 31
          PY
  real-arm-fixture:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    env:
      PYTHONPATH: src:.:tests
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Fetch exact verifier-only asset inside this job into RUNNER_TEMP
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import hashlib, io, json, os, stat, urllib.request, zipfile
          from pathlib import Path
          url = 'https://github.com/howardweale/lightyear-carddemo-modernization/releases/download/full-intcalc-c1-proposal-r3/VERIFIER-CASES.zip'
          with urllib.request.urlopen(url, timeout=30) as response:
              raw = response.read(1024*1024+1)
          assert len(raw) <= 1024*1024 and hashlib.sha256(raw).hexdigest() == '6936f0cfbad8925098ff8068d7b79a18f3a9a8d58ccc6b2d8c93c5c6d3f18e33'
          root = Path(os.environ['RUNNER_TEMP'])/'intcalc-verifier'
          root.mkdir()
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              names = archive.namelist()
              assert len(names)==3 and set(names)=={'BUNDLE.json','cases.json','freeze.py'}
              for item in archive.infolist():
                  assert item.file_size <= 128*1024 and stat.S_ISREG(item.external_attr >> 16)
                  (root/item.filename).write_bytes(archive.read(item))
          manifest = json.loads((root/'BUNDLE.json').read_text())
          assert manifest['model_context_eligible'] is False
          for name, row in manifest['files'].items():
              data = (root/name).read_bytes()
              assert len(data)==row['bytes'] and hashlib.sha256(data).hexdigest()==row['sha256']
          PY
      - name: Freeze private cases without printing or publishing them
        shell: bash
        run: |
          set -euo pipefail
          python3 -B "$RUNNER_TEMP/intcalc-verifier/freeze.py" --root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/intcalc-frozen" > "$RUNNER_TEMP/c2-freeze-private.log" 2>&1
      - name: Only two digest-pinned image pulls
        shell: bash
        run: |
          set -euo pipefail
          docker pull --platform=linux/arm64 eclipse-temurin@sha256:3d25d5cb6ca22137a17d2aeddc7b965027ce1e404d52c5c92a8796cece4d7b07
          docker pull --platform=linux/arm64 eclipse-temurin@sha256:8def71d61fd7f95b08480f51e8ac35e37ec87a0aaad6950a6f1e35c771de5b2d
      - name: Real adapter workers and absolute gate deadline; public fixture only
        run: python3 -B tools/qualify_intcalc_preview_build_gate.py
      - uses: actions/upload-artifact@v4
        with:
          name: c2-build-gate-counts-hashes-cleanup
          path: ${{ runner.temp }}/c2-build-gate-public.json
          if-no-files-found: error
