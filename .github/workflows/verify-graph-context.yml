name: Verify graph context (zero model)
on:
  pull_request:
permissions:
  contents: read
jobs:
  graph:
    if: startsWith(github.head_ref, 'codex/verify-graph-')
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[verify]"
      - name: Protected paths and offline tests
        shell: pwsh
        env:
          PYTHONPATH: src;.
          PYTHONUTF8: '1'
          PYTHONDONTWRITEBYTECODE: '1'
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          python -c "import mcp"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/check_verify_graph_boundary.py --base $env:BASE
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_verify*.py"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_graph_memory*.py"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_factory.py"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_measured_factory.py"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_ms94_b06*.py"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_*tower*.py"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_decision_console*.py"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest tests.test_graph_explorer
          exit $LASTEXITCODE
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Graph memory browser acceptance
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONUTF8: '1'
        run: |
          npm ci --prefix tests/browser --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Push-Location tests/browser
          npx playwright install chromium
          Pop-Location
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node tests/browser/graph-memory.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node tests/browser/verify-graph-review.mjs
          exit $LASTEXITCODE
