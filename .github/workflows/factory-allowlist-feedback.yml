name: Factory allowlist and feedback fixtures
on:
  pull_request:
    paths: ['src/lightyear_factory/**', 'tests/test_factory_allowlist_feedback.py', '.github/workflows/factory-allowlist-feedback.yml']
  push:
    branches: [main]
    paths: ['src/lightyear_factory/**', 'tests/test_factory_allowlist_feedback.py', '.github/workflows/factory-allowlist-feedback.yml']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.ref == 'refs/heads/main' && github.run_id || 'branch' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  boundary-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -e .
      - name: Run only offline fixture boundaries
        env:
          PYTHONPATH: .:src:tests
        run: python -B -m unittest test_factory_allowlist_feedback -v
