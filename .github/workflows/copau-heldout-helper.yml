name: COPAU held-out helper synthetic qualification
on: [pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.ref == 'refs/heads/main' && github.run_id || 'branch' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  windows-primary:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Reference import dependency only; no database service
        run: python -m pip install "psycopg[binary]>=3.2,<4"
      - name: Synthetic-only reference, scanner, corpus and custody tests
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          if [ "$RUNNER_OS" = Windows ]; then export PYTHONPATH='src;.'; else export PYTHONPATH='src:.'; fi
          python -B -m unittest tests.test_copau_answer_key tests.test_copau_public_corpus_index tests.test_copau_seed_custody -v
  linux-portability:
    needs: windows-primary
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Reference import dependency only; no database service
        run: python -m pip install "psycopg[binary]>=3.2,<4"
      - name: Synthetic-only reference, scanner, corpus and custody tests
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          if [ "$RUNNER_OS" = Windows ]; then export PYTHONPATH='src;.'; else export PYTHONPATH='src:.'; fi
          python -B -m unittest tests.test_copau_answer_key tests.test_copau_public_corpus_index tests.test_copau_seed_custody -v
