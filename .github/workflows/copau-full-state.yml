name: COPAU full-state public capability
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.ref == 'refs/heads/main' && github.run_id || 'branch' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  public-postgres-observer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: [5432/tcp]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12.16'
      - name: Install existing pinned public PostgreSQL client
        run: python -m pip install 'psycopg[binary]==3.2.10' cryptography==46.0.3
      - name: Observe real public database transactions and independent durable state
        env:
          PYTHONPATH: src:.:tests
          PUBLIC_PG_PORT: ${{ job.services.postgres.ports[5432] }}
        run: |
          python --version
          python -B -m unittest test_copau_pg_observer -v
          python -B -m tools.copau_pg_observer_ci --port "$PUBLIC_PG_PORT"
