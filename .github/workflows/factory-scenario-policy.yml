name: Factory scenario policy
on:
  pull_request:
    paths: ['src/lightyear_factory/**', 'src/lightyear_control_tower/**', 'src/lightyear_business_rules/**', 'tests/test_constant_evidence.py', 'src/lightyear_mainframe/constant_evidence.py', 'tests/test_scenario_policy.py', 'tests/test_threshold*.py', 'tests/test_factory_decisions.py', 'tools/build_factory_decision_review.py', 'src/lightyear_mainframe/systematic_mutation.py', 'docs/factory/**', '.github/workflows/factory-scenario-policy.yml']
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.ref == 'refs/heads/main' && github.run_id || 'branch' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  scenario-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install cryptography
      - run: python -B -m unittest test_constant_evidence test_intcalc_releasability test_derived_factory_status test_scenario_policy test_threshold3 test_threshold_conditions test_factory_decisions test_business_rules test_rule_evidence_strength test_decision_console_factory.FactoryTests.test_real_signed_release_keeps_compiler_scope_and_exact_io_line
        env:
          PYTHONPATH: src:tests:.
