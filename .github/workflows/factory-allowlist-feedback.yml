name: Factory allowlist and feedback fixtures
on:
  pull_request:
    paths: ['src/lightyear_factory/**', 'src/lightyear_execution/**', 'factory/execution/policy.json', 'tools/ci/factory_container_probe.py', 'tests/test_factory_allowlist_feedback.py', 'tests/test_factory_publications.py', 'tools/check_factory_publications.py', '.github/workflows/factory-main-packages.yml', 'tests/test_factory_authorship.py', 'tests/test_factory_model_admission.py', 'tests/test_factory_build_receipt.py', 'tests/test_factory_controller_dryruns.py', 'tests/test_factory_graph_tools.py', 'tests/test_factory_encrypted_artifacts.py', 'tests/test_factory_transport_records.py', 'tests/test_copau_judge_freeze.py', 'tools/check_copau_judge_freeze.py', '.github/workflows/copau-factory-judge.yml', '.github/workflows/factory-allowlist-feedback.yml']
  push:
    branches: [main]
    paths: ['src/lightyear_factory/**', 'src/lightyear_execution/**', 'factory/execution/policy.json', 'tools/ci/factory_container_probe.py', 'tests/test_factory_allowlist_feedback.py', 'tests/test_factory_publications.py', 'tools/check_factory_publications.py', '.github/workflows/factory-main-packages.yml', 'tests/test_factory_authorship.py', 'tests/test_factory_model_admission.py', 'tests/test_factory_build_receipt.py', 'tests/test_factory_controller_dryruns.py', 'tests/test_factory_graph_tools.py', 'tests/test_factory_encrypted_artifacts.py', 'tests/test_factory_transport_records.py', 'tests/test_copau_judge_freeze.py', 'tools/check_copau_judge_freeze.py', '.github/workflows/copau-factory-judge.yml', '.github/workflows/factory-allowlist-feedback.yml']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.ref == 'refs/heads/main' && github.run_id || 'branch' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  boundary-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[control-tower]"
      - name: Run only offline fixture boundaries
        env:
          PYTHONPATH: .:src:tests
        run: python -B -m unittest test_factory_allowlist_feedback test_factory_publications test_factory_authorship test_factory_model_admission test_factory_build_receipt test_factory_controller_dryruns test_factory_graph_tools test_factory_encrypted_artifacts test_factory_transport_records test_copau_judge_freeze -v
      - name: Pull the exact policy image for the container fixture
        run: |
          image="$(python -c 'import json; p=json.load(open("factory/execution/policy.json"))["runtime"]; print(p["image"]+"@sha256:"+p["image_digest"])')"
          docker pull "$image"
      - name: Prove candidate build and excluded-state refusal inside OCI
        env:
          PYTHONPATH: .:src:tests
        run: python -B tools/ci/factory_container_probe.py
