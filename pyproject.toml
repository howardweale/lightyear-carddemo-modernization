[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lightyear-carddemo-oracle"
version = "0.47.2"
description = "Graph-grounded, extensible and evidence-governed modernization factory for CardDemo"
requires-python = ">=3.11"

[project.optional-dependencies]
docs = [
    "python-docx>=1.1,<2",
    "reportlab>=4,<5",
]
dependencies = []

[project.scripts]
carddemo-oracle = "carddemo_oracle.cli:main"
lightyear-graph = "lightyear_knowledge_graph.cli:main"
lightyear-factory = "lightyear_factory.cli:main"
lightyear-runtime = "lightyear_runtime.cli:main"
lightyear-audit = "lightyear_audit.cli:main"
lightyear-execution = "lightyear_execution.cli:main"
lightyear-control-tower = "lightyear_control_tower.cli:main"
factorydark-readiness = "lightyear_readiness.cli:main"
factorydark-data = "lightyear_data.cli:main"
lightyear-extensions = "lightyear_extensions.cli:main"
lightyear-pilot = "lightyear_pilot.cli:main"

[tool.setuptools.packages.find]
where = ["src", "extensions/runtime"]
