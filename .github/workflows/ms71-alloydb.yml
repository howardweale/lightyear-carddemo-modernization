name: MS71 managed target contracts
on:
  pull_request:
    paths:
      - 'src/lightyear_data/**'
      - 'tools/cloudbank_ms71.py'
      - 'tools/cloudbank_alloydb_*.py'
      - 'cloudbank-ms71.*'
      - 'docs/receipts/ms71-20260912a/**'
      - 'docs/receipts/alloydb-platform-*/**'
      - 'docs/receipts/alloydb-platform.anchor.json'
      - 'tests/test_cloudbank_*.py'
      - 'factory/cloudbank/alloydb-second-target/**'
      - '.github/workflows/ms71-alloydb.yml'
  push:
    branches: [main]
    paths:
      - 'src/lightyear_data/**'
      - 'tools/cloudbank_ms71.py'
      - 'tools/cloudbank_alloydb_*.py'
      - 'cloudbank-ms71.*'
      - 'docs/receipts/ms71-20260912a/**'
      - 'docs/receipts/alloydb-platform-*/**'
      - 'docs/receipts/alloydb-platform.anchor.json'
      - 'tests/test_cloudbank_*.py'
      - 'factory/cloudbank/alloydb-second-target/**'
      - '.github/workflows/ms71-alloydb.yml'
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_cloudbank_ms71.py -v
      - run: python -m unittest discover -s tests -p test_cloudbank_alloydb_*.py -v
      - run: python -m unittest discover -s tests -p test_cloudbank_ms66_dual_lane.py -v
      - run: python -m unittest discover -s tests -p test_cloudbank_whole_application_equivalence.py -v
      - run: python -m unittest discover -s tests -p test_cloudbank_journeys.py -v
      - run: python -m unittest discover -s tests -p test_cloudbank_publication.py -v
      - if: runner.os == 'Linux'
        run: ./cloudbank-ms71.sh --help
      - if: runner.os == 'Windows'
        run: ./cloudbank-ms71.ps1 --help
