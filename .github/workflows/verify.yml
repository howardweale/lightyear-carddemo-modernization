name: Verify oracle and Spring Batch candidate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cloudbank-source-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out factory source
        uses: actions/checkout@v7

      - name: Check out exact CloudBank source
        run: |
          git -c core.autocrlf=false -c core.eol=lf clone --filter=blob:none --no-checkout https://github.com/oracle/microservices-backend.git ../cloudbank-upstream
          git -C ../cloudbank-upstream -c core.autocrlf=false -c core.eol=lf checkout --detach 4f41b16d00c45503f691836fee8138010c969e86

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify and compile the pinned upstream service set
        run: |
          export LIGHTYEAR_CLOUDBANK_BASELINE_EVIDENCE_KEY="$(openssl rand -hex 32)"
          ./cloudbank-executable-baseline.sh verify-source ../cloudbank-upstream
          ./cloudbank-executable-baseline.sh source-build ../cloudbank-upstream work/cloudbank-source-build.receipt.json github-ci-development-only
          ./cloudbank-executable-baseline.sh verify-receipt work/cloudbank-source-build.receipt.json
          ./cloudbank-customer-postgresql.sh verify
          ./cloudbank-customer-postgresql.sh verify-source ../cloudbank-upstream
          ./cloudbank-dark-factory.sh verify
          ./cloudbank-dark-factory.sh verify-source ../cloudbank-upstream
          ./cloudbank-production-qualification.sh verify
          ./cloudbank-production-qualification.sh verify-source ../cloudbank-upstream
          ./cloudbank-transaction-wave.sh verify
          ./cloudbank-transaction-wave.sh verify-source ../cloudbank-upstream
          ./cloudbank-transaction-core.sh verify
          ./cloudbank-transaction-core.sh verify-source ../cloudbank-upstream
          ./cloudbank-native-wave.sh verify
          ./cloudbank-native-wave.sh verify-source ../cloudbank-upstream
          ./cloudbank-native-wave.sh materialize ../cloudbank-upstream work/cloudbank-native-wave-ci
          (
            cd work/cloudbank-native-wave-ci
            mvn -pl account,transfer -am -DskipTests package
            transfer_log="${RUNNER_TEMP}/cloudbank-ms60-transfer.log"
            transfer_pid=""
            cleanup_transfer() {
              if [[ -n "$transfer_pid" ]]; then
                kill "$transfer_pid" 2>/dev/null || true
                wait "$transfer_pid" 2>/dev/null || true
              fi
            }
            trap cleanup_transfer EXIT
            env \
              SPRING_PROFILES_ACTIVE=cloudbank-wave \
              SERVER_ADDRESS=127.0.0.1 \
              SERVER_PORT=18082 \
              EUREKA_CLIENT_ENABLED=false \
              SPRING_CLOUD_DISCOVERY_ENABLED=false \
              SPRING_CLOUD_CONFIG_ENABLED=false \
              CLOUDBANK_TRANSACTION_INTERNAL_TOKEN=ci-synthetic-token \
              CLOUDBANK_WAVE_USER_PASSWORD=ci-synthetic-password \
              ACCOUNT_TRANSACTION_URL=http://127.0.0.1:18081/api/v1/transfers \
              java -jar transfer/target/transfer-0.0.1-SNAPSHOT.jar \
              >"$transfer_log" 2>&1 &
            transfer_pid=$!
            transfer_healthy=false
            for _ in {1..60}; do
              if curl --fail --silent http://127.0.0.1:18082/actuator/health >/dev/null; then
                transfer_healthy=true
                break
              fi
              if ! kill -0 "$transfer_pid" 2>/dev/null; then
                tail -120 "$transfer_log"
                exit 1
              fi
              sleep 1
            done
            if [[ "$transfer_healthy" != true ]]; then
              tail -120 "$transfer_log"
              exit 1
            fi
            cleanup_transfer
            transfer_pid=""
            trap - EXIT
          )
          ./cloudbank-oracle-equivalence.sh verify
          ./cloudbank-oracle-equivalence.sh verify-source ../cloudbank-upstream
          ./cloudbank-oracle-equivalence.sh materialize ../cloudbank-upstream work/cloudbank-ms61-ci
          (
            cd work/cloudbank-ms61-ci/oracle
            mvn -pl account,transfer -am \
              -Dtest=OracleAccountEquivalenceTests,OracleTransferEquivalenceTests \
              -Dsurefire.failIfNoSpecifiedTests=false -DskipTests test
          )
          (
            cd work/cloudbank-ms61-ci/postgresql
            mvn -pl account,transfer -am \
              -Dtest=PostgreSqlAccountEquivalenceTests,PostgreSqlTransferEquivalenceTests \
              -Dsurefire.failIfNoSpecifiedTests=false -DskipTests test
          )
          ./cloudbank-production-oauth.sh verify
          ./cloudbank-production-oauth.sh verify-source ../cloudbank-upstream
          ./cloudbank-production-oauth.sh materialize ../cloudbank-upstream work/cloudbank-ms62-ci
          (
            cd work/cloudbank-ms62-ci
            mvn -pl azn-server,account,transfer -am \
              -Dtest=TransferServiceTests \
              -Dsurefire.failIfNoSpecifiedTests=false test
          )
          ./cloudbank-checks-messaging.sh verify
          ./cloudbank-checks-messaging.sh verify-source ../cloudbank-upstream
          ./cloudbank-checks-messaging.sh materialize ../cloudbank-upstream work/cloudbank-ms63-ci
          (
            cd work/cloudbank-ms63-ci
            mvn -pl azn-server,account,transfer,checks,testrunner -am \
              -DskipTests package
          )
          ./cloudbank-edge-ai.sh verify
          ./cloudbank-edge-ai.sh verify-source ../cloudbank-upstream
          ./cloudbank-edge-ai.sh materialize ../cloudbank-upstream work/cloudbank-ms64-ci
          (
            cd work/cloudbank-ms64-ci
            workcell_tests="ProductionAudienceTokenCustomizerTest,ChecksTargetWorkcellTest,"
            workcell_tests+="TestrunnerTargetWorkcellTest,CreditscoreApplicationTests,ChatbotApplicationTest"
            mvn -pl azn-server,customer,account,transfer,checks,testrunner,creditscore,chatbot -am \
              -DskipTests -Djkube.skip=true -Ddependency-check.skip=true package
            mvn -pl azn-server,checks,testrunner,creditscore,chatbot -am \
              "-Dtest=$workcell_tests" \
              -Dsurefire.failIfNoSpecifiedTests=false \
              -Djkube.skip=true -Ddependency-check.skip=true test
          )
          ./cloudbank-production-readiness.sh verify
          ./cloudbank-production-readiness.sh verify-source ../cloudbank-upstream
          ./cloudbank-production-readiness.sh materialize ../cloudbank-upstream work/cloudbank-ms65-ci
          for service in azn-server customer account transfer checks testrunner creditscore chatbot; do
            test -f "work/cloudbank-ms65-ci/$service/pom.xml"
          done
          ./cloudbank-whole-application-equivalence.sh verify
          ./cloudbank-whole-application-equivalence.sh verify-source ../cloudbank-upstream
          ./cloudbank-whole-application-equivalence.sh materialize ../cloudbank-upstream work/cloudbank-ms66-ci
          for service in azn-server customer account transfer checks testrunner creditscore chatbot; do
            test -f "work/cloudbank-ms66-ci/$service/pom.xml"
          done

      - name: Publish bounded CI build receipt
        uses: actions/upload-artifact@v4
        with:
          name: cloudbank-source-build-${{ github.sha }}
          path: work/cloudbank-source-build.receipt.json
          if-no-files-found: error

  pli-build-attestation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Build and verify bounded PL/I candidate evidence
        run: ./pli-build-attestation.sh ci-build

      - name: Generate workload-identity build provenance
        uses: actions/attest@v4
        with:
          subject-path: work/pli-build-attestation-ci-build/pli-auth-risk-candidate.jar

      - name: Generate workload-identity SBOM attestation
        uses: actions/attest@v4
        with:
          subject-path: work/pli-build-attestation-ci-build/pli-auth-risk-candidate.jar
          sbom-path: work/pli-build-attestation-ci-build/sbom.cdx.json

      - name: Publish attested build evidence
        uses: actions/upload-artifact@v4
        with:
          name: pli-build-attestation-${{ github.sha }}
          path: work/pli-build-attestation-ci-build/
          if-no-files-found: error

  verifier-escape-gauntlet:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Attack verifier and holdout boundaries
        if: runner.os == 'Linux'
        run: ./verifier-gauntlet.sh

      - name: Attack verifier and holdout boundaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\verifier-gauntlet.ps1

  differential-verification:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check out pinned CardDemo source
        shell: bash
        run: |
          git -c core.autocrlf=false -c core.eol=lf clone --filter=blob:none --no-checkout https://github.com/aws-samples/aws-mainframe-modernization-carddemo.git ../carddemo-upstream
          git -C ../carddemo-upstream -c core.autocrlf=false -c core.eol=lf checkout --detach 59cc6c2fd7ebd7ef7925cad552a01a4b8b6e4d5e

      - name: Check out pinned CloudBank source
        shell: bash
        run: |
          git -c core.autocrlf=false -c core.eol=lf clone --filter=blob:none --no-checkout https://github.com/oracle/microservices-backend.git ../cloudbank-upstream
          git -C ../cloudbank-upstream -c core.autocrlf=false -c core.eol=lf checkout --detach 4f41b16d00c45503f691836fee8138010c969e86

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: candidate-java/pom.xml

      - name: Verify pinned CloudBank inventory
        if: runner.os == 'Linux'
        run: ./cloudbank-reference-estate.sh verify-inventory ../cloudbank-upstream

      - name: Verify pinned CloudBank inventory (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\cloudbank-reference-estate.ps1 verify-inventory ..\cloudbank-upstream

      - name: Run unit and differential verification
        if: runner.os == 'Linux'
        run: ./verify.sh

      - name: Run unit and differential verification (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\verify.ps1

      - name: Reject verification that mutates tracked evidence
        run: git diff --exit-code
