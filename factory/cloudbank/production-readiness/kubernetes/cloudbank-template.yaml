apiVersion: v1
kind: Namespace
metadata:
  name: "{{NAMESPACE}}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudbank-runtime
  namespace: "{{NAMESPACE}}"
data:
  LIGHTYEAR_RELEASE: "0.65.0"
  LIGHTYEAR_CONFIGURATION_SHA256: "{{CONFIGURATION_SHA256}}"
  CLOUDBANK_SECURITY_ISSUER_URI: "http://azn-server:8080"
  CLOUDBANK_SECURITY_JWK_SET_URI: "http://azn-server:8080/oauth2/jwks"
  CLOUDBANK_OAUTH_ISSUER: "http://azn-server:8080"
  CLOUDBANK_OAUTH_JWK_SET_URI: "http://azn-server:8080/oauth2/jwks"
  CLOUDBANK_SECURITY_SERVICE_TOKEN_URI: "http://azn-server:8080/oauth2/token"
  AZN_AUTHORIZATION_SERVER_SIGNING_KEY_PRIVATE_KEY_PATH: "/var/run/secrets/cloudbank/signing/private.pem"
  AZN_AUTHORIZATION_SERVER_SIGNING_KEY_PUBLIC_KEY_PATH: "/var/run/secrets/cloudbank/signing/public.pem"
  ACCOUNT_TRANSACTION_URL: "http://account:8080/api/v1/transfers"
  ACCOUNT_JOURNAL_URL: "http://account:8080/api/v1/account/journal"
  SERVER_ADDRESS: "0.0.0.0"
  EUREKA_CLIENT_ENABLED: "false"
  SPRING_CLOUD_DISCOVERY_ENABLED: "false"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: azn-server
  namespace: "{{NAMESPACE}}"
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: azn-server
  namespace: "{{NAMESPACE}}"
  labels:
    app.kubernetes.io/name: azn-server
    app.kubernetes.io/part-of: cloudbank
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: azn-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: azn-server
        app.kubernetes.io/part-of: cloudbank
      annotations:
        lightyear.ai/configuration-sha256: "{{CONFIGURATION_SHA256}}"
    spec:
      serviceAccountName: azn-server
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: azn-server
        image: "{{IMAGE_AZN_SERVER}}"
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        envFrom:
        - configMapRef:
            name: cloudbank-runtime
        - secretRef:
            name: "{{SECRET_AZN_SERVER}}"
        env:
        - {name: SERVER_PORT, value: "8080"}
        - {name: SPRING_CLOUD_CONFIG_ENABLED, value: "false"}
        - {name: SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT, value: org.hibernate.dialect.PostgreSQLDialect}
        - {name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED, value: "true"}
        - {name: MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS, value: never}
        - {name: AZN_BOOTSTRAP_USERS_ENABLED, value: "false"}
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: http
          failureThreshold: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: http
          periodSeconds: 10
          timeoutSeconds: 2
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: signing-keys
          mountPath: /var/run/secrets/cloudbank/signing
          readOnly: true
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 128Mi
      - name: signing-keys
        secret:
          secretName: "{{SECRET_AZN_SERVER}}"
          items:
          - key: private.pem
            path: private.pem
          - key: public.pem
            path: public.pem
---
apiVersion: v1
kind: Service
metadata:
  name: azn-server
  namespace: "{{NAMESPACE}}"
spec:
  selector:
    app.kubernetes.io/name: azn-server
  ports:
  - name: http
    port: 8080
    targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: azn-server
  namespace: "{{NAMESPACE}}"
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: azn-server
---
