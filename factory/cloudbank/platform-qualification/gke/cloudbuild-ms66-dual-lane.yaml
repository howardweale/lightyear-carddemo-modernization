steps:
- id: checkout-pinned-controller
  name: gcr.io/cloud-builders/git
  entrypoint: /bin/bash
  args:
  - -ceu
  - |
    [[ "${_SOURCE_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
    git init /workspace/controller
    git -C /workspace/controller remote add origin \
      https://github.com/howardweale/lightyear-carddemo-modernization.git
    git -C /workspace/controller fetch --depth=1 origin "${_SOURCE_COMMIT}"
    git -C /workspace/controller checkout --detach FETCH_HEAD
    [[ "$$(git -C /workspace/controller rev-parse HEAD)" == "${_SOURCE_COMMIT}" ]]

- id: checkout-exact-upstream
  name: gcr.io/cloud-builders/git
  entrypoint: /bin/bash
  args:
  - -ceu
  - |
    git init /workspace/upstream
    git -C /workspace/upstream remote add origin https://github.com/oracle/microservices-backend.git
    git -C /workspace/upstream sparse-checkout init --cone
    git -C /workspace/upstream sparse-checkout set cloudbank-v5
    git -C /workspace/upstream fetch --depth=1 origin 4f41b16d00c45503f691836fee8138010c969e86
    git -C /workspace/upstream checkout --detach FETCH_HEAD
    [[ "$$(git -C /workspace/upstream rev-parse HEAD)" == "4f41b16d00c45503f691836fee8138010c969e86" ]]
    [[ "$$(git -C /workspace/upstream rev-parse 'HEAD^{tree}')" == \
       "6aa92e89c783f123c4da8d7ae18108004a4f4a99" ]]
    [[ "$$(git -C /workspace/upstream rev-parse 'HEAD:cloudbank-v5')" == \
       "bd918386209f284a1ed31802555740eb34b75348" ]]

- id: materialize-governed-hardening
  name: gcr.io/google.com/cloudsdktool/google-cloud-cli:573.0.0
  waitFor: [checkout-pinned-controller, checkout-exact-upstream]
  entrypoint: /bin/bash
  args:
  - -ceu
  - |
    cd /workspace/controller
    export LIGHTYEAR_PYTHON=python3
    bash ./cloudbank-ms66-dual-lane.sh verify-hardening --project-root /workspace/controller
    bash ./cloudbank-ms66-dual-lane.sh materialize \
      --project-root /workspace/controller \
      --source-root /workspace/upstream \
      --output-root /workspace/hardened
    [[ "$$(git -C /workspace/upstream status --porcelain --untracked-files=no)" == "" ]]

- id: compile-governed-source
  name: maven:3.9.11-eclipse-temurin-21
  waitFor: [materialize-governed-hardening]
  entrypoint: /bin/bash
  args:
  - -ceu
  - |
    cd /workspace/hardened/cloudbank-v5
    mvn -B -ntp -DskipTests -Dcheckstyle.skip=true -Ddependency-check.skip=true \
      -Djkube.skip=true clean package
    mvn -B -ntp -pl account,transfer -am \
      -Dtest=Ms66WithdrawNoEffectCallbacksTests,Ms66InsufficientFundsTransferTests \
      -Dsurefire.failIfNoSpecifiedTests=false -Dcheckstyle.skip=true \
      -Ddependency-check.skip=true -Djkube.skip=true test
    for service in azn-server customer account transfer checks testrunner creditscore chatbot; do
      test -f "$$service/target/$$service-0.0.1-SNAPSHOT.jar"
    done

- id: build-and-push-governed-source-images
  name: gcr.io/cloud-builders/docker
  waitFor: [compile-governed-source]
  entrypoint: /bin/bash
  args:
  - -ceu
  - |
    [[ "${_JAVA_BASE_IMAGE}" =~ ^[^[:space:]]+@sha256:[0-9a-f]{64}$ ]]
    registry="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}"
    source_commit="${_SOURCE_COMMIT}"
    short="$${source_commit:0:12}"
    retry_push() {
      local image="$$1" attempt delay=5
      for attempt in 1 2 3 4 5; do
        docker push "$$image" && return 0
        [[ "$$attempt" -lt 5 ]] || return 1
        sleep "$$delay"
        delay=$$((delay * 2))
      done
    }
    : > /workspace/source-tags.tsv
    for service in azn-server customer account transfer checks testrunner creditscore chatbot; do
      stage="/workspace/image-stage-$$service"
      mkdir -p "$$stage"
      cp "/workspace/hardened/cloudbank-v5/$$service/target/$$service-0.0.1-SNAPSHOT.jar" \
        "$$stage/application.jar"
      cp /workspace/controller/factory/cloudbank/platform-qualification/gke/Dockerfile.ms66-oracle-source \
        "$$stage/Dockerfile"
      tag="$$registry/$$service-ms66-oracle:$$short"
      docker build --pull \
        --build-arg "BASE_IMAGE=${_JAVA_BASE_IMAGE}" \
        --build-arg "SOURCE_COMMIT=${_SOURCE_COMMIT}" \
        --build-arg "HARDENING_PATCH_SHA256=092a982c5037f41bf7a7c762fde961848ed3b751bed262c9b7bceb810307f349" \
        --build-arg "SERVICE=$$service" --tag "$$tag" "$$stage"
      retry_push "$$tag"
      printf '%s\t%s\n' "$$service" "$$tag" >> /workspace/source-tags.tsv
      rm -r -- "$$stage"
    done

- id: mirror-native-runtime-images
  name: gcr.io/cloud-builders/docker
  waitFor: [checkout-pinned-controller]
  entrypoint: /bin/bash
  args:
  - -ceu
  - |
    [[ "${_ORACLE_IMAGE_CANDIDATE}" =~ ^[^[:space:]]+:[^[:space:]]+$ ]]
    [[ "${_MICROTX_IMAGE_CANDIDATE}" =~ ^[^[:space:]]+:[^[:space:]]+$ ]]
    registry="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}"
    source_commit="${_SOURCE_COMMIT}"
    short="$${source_commit:0:12}"
    retry_push() {
      local image="$$1" attempt delay=5
      for attempt in 1 2 3 4 5; do
        docker push "$$image" && return 0
        [[ "$$attempt" -lt 5 ]] || return 1
        sleep "$$delay"
        delay=$$((delay * 2))
      done
    }
    docker pull "${_ORACLE_IMAGE_CANDIDATE}"
    docker pull "${_MICROTX_IMAGE_CANDIDATE}"
    oracle_tag="$$registry/oracle-free-ms66:$$short"
    microtx_tag="$$registry/microtx-ms66:$$short"
    docker tag "${_ORACLE_IMAGE_CANDIDATE}" "$$oracle_tag"
    docker tag "${_MICROTX_IMAGE_CANDIDATE}" "$$microtx_tag"
    retry_push "$$oracle_tag"
    retry_push "$$microtx_tag"
    printf 'ORACLE_TAG=%s\nMICROTX_TAG=%s\n' "$$oracle_tag" "$$microtx_tag" \
      > /workspace/native-tags.env

- id: run-durable-ms66-dual-lane
  name: gcr.io/google.com/cloudsdktool/google-cloud-cli:573.0.0
  waitFor: [build-and-push-governed-source-images, mirror-native-runtime-images]
  entrypoint: /bin/bash
  env:
  - CLOUDSDK_CORE_PROJECT=$PROJECT_ID
  - KUBECONFIG=/workspace/ms66-kubeconfig
  secretEnv:
  - LIGHTYEAR_CLOUDBANK_BASELINE_EVIDENCE_KEY
  args:
  - -ceu
  - |
    trap 'rm -f /workspace/ms66-kubeconfig' EXIT
    build_id="$BUILD_ID"
    [[ "$$build_id" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]
    mkdir -p /workspace/inputs /workspace/locks
    fetch_input() {
      local uri="$$1" digest="$$2" output="$$3"
      [[ "$$digest" =~ ^[0-9a-f]{64}$ ]]
      gcloud storage cp "$$uri" "$$output" --project "$PROJECT_ID"
      printf '%s  %s\n' "$$digest" "$$output" | sha256sum --check -
    }
    fetch_input "${_MS61_RECEIPT_URI}" "${_MS61_RECEIPT_SHA256}" /workspace/inputs/ms61-receipt.json
    fetch_input "${_MS64_RECEIPT_URI}" "${_MS64_RECEIPT_SHA256}" /workspace/inputs/ms64-receipt.json
    fetch_input "${_TARGET_IMAGE_LOCK_URI}" "${_TARGET_IMAGE_LOCK_SHA256}" \
      /workspace/inputs/target-image-lock.json

    source /workspace/native-tags.env
    export ORACLE_TAG MICROTX_TAG
    export GCP_REGION="${_REGION}" ARTIFACT_REPOSITORY="${_ARTIFACT_REPOSITORY}"
    python3 - <<'PY'
    import json, os, subprocess
    rows = {}
    for line in open('/workspace/source-tags.tsv', encoding='utf-8'):
        service, tag = line.rstrip('\n').split('\t')
        digest = subprocess.check_output([
            'gcloud', 'artifacts', 'docker', 'images', 'describe', tag,
            '--format=value(image_summary.digest)'], text=True).strip()
        if not digest.startswith('sha256:') or len(digest) != 71:
            raise SystemExit('invalid governed source image digest')
        rows[service] = tag.rsplit(':', 1)[0] + '@' + digest
    with open('/workspace/locks/source-images.json', 'w', encoding='utf-8') as target:
        json.dump(rows, target, sort_keys=True)
    for variable, output in [('ORACLE_TAG', 'oracle-image.txt'), ('MICROTX_TAG', 'microtx-image.txt')]:
        tag = os.environ[variable]
        digest = subprocess.check_output([
            'gcloud', 'artifacts', 'docker', 'images', 'describe', tag,
            '--format=value(image_summary.digest)'], text=True).strip()
        if not digest.startswith('sha256:') or len(digest) != 71:
            raise SystemExit('invalid native runtime image digest')
        open('/workspace/locks/' + output, 'w', encoding='utf-8').write(tag.rsplit(':', 1)[0] + '@' + digest)
    PY
    oracle_image="$$(cat /workspace/locks/oracle-image.txt)"
    microtx_image="$$(cat /workspace/locks/microtx-image.txt)"

    cd /workspace/controller
    export LIGHTYEAR_PYTHON=python3
    bash ./cloudbank-ms66-dual-lane.sh source-lock \
      --images /workspace/locks/source-images.json \
      --materialization /workspace/hardened/oracle-hardening.materialization.json \
      --controller-commit "${_SOURCE_COMMIT}" \
      --cloud-build-id "$$build_id" \
      --java-base-image "${_JAVA_BASE_IMAGE}" \
      --oracle-runtime-image "$$oracle_image" \
      --microtx-runtime-image "$$microtx_image" \
      --signer "${_SIGNER}" \
      --output /workspace/locks/oracle-source-image-lock.json

    gcloud container clusters get-credentials "${_CLUSTER}" \
      --region "${_REGION}" --dns-endpoint --project "$PROJECT_ID"
    command -v kubectl >/dev/null
    command -v gke-gcloud-auth-plugin >/dev/null
    python3 -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 11) else 1)'
    export LIGHTYEAR_NON_PRODUCTION_ACK=I-AUTHORIZE-MS67-NON-PRODUCTION-MUTATIONS
    isolated_namespace="cloudbank-ms66-$${build_id:0:8}"
    evidence="${_EVIDENCE_BUCKET_PREFIX}/ms66-$$build_id"
    bash ./cloudbank-ms66-dual-lane.sh run \
      --project-root /workspace/controller \
      --source-root /workspace/upstream \
      --ms61-receipt /workspace/inputs/ms61-receipt.json \
      --ms64-receipt /workspace/inputs/ms64-receipt.json \
      --source-image-lock /workspace/locks/oracle-source-image-lock.json \
      --target-image-lock /workspace/inputs/target-image-lock.json \
      --project "$PROJECT_ID" --region "${_REGION}" --cluster "${_CLUSTER}" \
      --target-namespace "${_TARGET_NAMESPACE}" \
      --isolated-namespace "$$isolated_namespace" \
      --model-namespace "${_MODEL_NAMESPACE}" --model-name "${_MODEL_NAME}" \
      --postgresql-probe-image "${_POSTGRESQL_PROBE_IMAGE}" \
      --output-root "/workspace/ms66-$$build_id" \
      --evidence-prefix "$$evidence" --signer "${_SIGNER}" --run-id "ms66-$$build_id"
    echo "MS66_DUAL_LANE_EVIDENCE=$$evidence/"
    echo "MS66_DUAL_LANE_RUN=PASSED"

availableSecrets:
  secretManager:
  - versionName: projects/$PROJECT_ID/secrets/${_EVIDENCE_SECRET}/versions/latest
    env: LIGHTYEAR_CLOUDBANK_BASELINE_EVIDENCE_KEY
options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: '100'
  logging: CLOUD_LOGGING_ONLY
tags:
- ms67-ms66-dual-lane
timeout: 7200s
