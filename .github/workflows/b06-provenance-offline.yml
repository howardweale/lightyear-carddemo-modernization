permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.ref == 'refs/heads/main' && github.run_id || 'branch' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  synthetic:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[control-tower]'
      - name: Authored fixtures; no local JDI evidence, Docker or models
        shell: bash
        run: |
          set -e
          python -B -m unittest discover -s tests -p 'test_b06_*.py' -v
          python -B -m unittest discover -s tests -p 'test_ms94_b06_*.py' -v
