name: Graph repair controller synthetic checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  graph-repair-synthetic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Synthetic graph loop and graph-off regressions
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then export PYTHONPATH='src;.;tests'; else export PYTHONPATH=src:.:tests; fi
          python -B -m unittest test_graph_repair_controller test_graph_legacy_view test_public_repair_controller test_public_evaluator_adapter
      - name: Fetch hash-pinned public context and prove full request bounds
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$RUNNER_OS" = Windows ]; then export PYTHONPATH='src;.;tests'; else export PYTHONPATH=src:.:tests; fi
          gh release download full-intcalc-graph-review-bindings-20261117-r2 --repo "$GITHUB_REPOSITORY" --pattern CURRENT-CONTEXT.json --dir "$RUNNER_TEMP/graph-context"
          python -B -c "from test_graph_repair_controller import pinned_context_proof; import sys; pinned_context_proof(sys.argv[1])" "$RUNNER_TEMP/graph-context/CURRENT-CONTEXT.json"
