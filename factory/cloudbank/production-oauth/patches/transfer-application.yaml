spring:
  application:
    name: transfer
  cloud:
    config:
      import-check:
        enabled: false
  config:
    import: classpath:common.yaml
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${CLOUDBANK_SECURITY_ISSUER_URI}
          jwk-set-uri: ${CLOUDBANK_SECURITY_JWK_SET_URI}
account:
  transaction:
    url: ${ACCOUNT_TRANSACTION_URL:http://account:8080/api/v1/transfers}
cloudbank:
  security:
    service-token:
      token-uri: ${CLOUDBANK_SECURITY_SERVICE_TOKEN_URI}
      client-id: ${CLOUDBANK_SECURITY_SERVICE_TOKEN_CLIENT_ID}
      client-secret: ${CLOUDBANK_SECURITY_SERVICE_TOKEN_CLIENT_SECRET}
      scope: cloudbank.internal
---
# Apply after the imported common.yaml, which disables service tokens by default.
spring:
  config:
    activate:
      on-profile: cloudbank-oauth
cloudbank:
  security:
    service-token:
      enabled: ${CLOUDBANK_SECURITY_SERVICE_TOKEN_ENABLED:true}
