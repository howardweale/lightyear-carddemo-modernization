spring:
  application:
    name: customer
  cloud:
    config:
      import-check:
        enabled: false

  liquibase:
    change-log: classpath:db/changelog/controller.yaml
    url: ${LIQUIBASE_DATASOURCE_URL:${SPRING_DATASOURCE_URL}}
    user: ${LIQUIBASE_DATASOURCE_USERNAME:${SPRING_DATASOURCE_USERNAME}}
    password: ${LIQUIBASE_DATASOURCE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
    enabled: ${LIQUIBASE_ENABLED:true}

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

  config:
    import: classpath:common.yaml
