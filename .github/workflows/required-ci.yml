name: Required CI gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.ref == 'refs/heads/main' && github.run_id || 'branch' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  documentation-and-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install PyYAML==6.0.3 cryptography
      - name: Fetch the recorded CardDemo measurement checkout
        # A historical refs/pull/*/merge object is not included by fetch-depth: 0.
        # Fetch its immutable ID; check_record_commit_claims still verifies identity and source bytes.
        run: git fetch --no-tags origin cf43585fc4fb7ae4466f7414eb4ae5028bcccad8 dba188ba166145808a59274240d0969e2783377a
      - name: Validate workflow policy and changed source syntax
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PYTHONPATH: .:src:tests
        run: |
          python -B -m unittest test_ci_gate -v
          python -B -m unittest test_stranded_work -v
          python -B tools/ci_gate.py lint
          python -B tools/check_status_pr.py
          python -B -m unittest test_status_output_policy -v
          git fetch --no-tags origin 37332f3d9d694387960ca0595acf7fdb2918224a
          python -B tools/check_evidence_files.py
          python -B -m unittest test_evidence_file_policy test_carddemo_release_retention -v
          python -B tools/check_ci_test_collection.py
          python -B tools/check_record_commit_claims.py --base "$BASE_SHA"
          python -B -m unittest test_ci_test_collection test_phase2_image_verifier test_claim_scope test_record_commit_claims -v
          python -B tools/check_tower_manual.py
          python -B -m unittest test_decision_console_manual -v
  required-ci:
    needs: documentation-and-lint
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 225
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install PyYAML==6.0.3
      - name: Report stranded merged work without issue writes
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B tools/ci/stranded_work.py --output work/ci/stranded-work.json
      - name: Require completed green final-head workflows
        env:
          GH_TOKEN: ${{ github.token }}
          LINT_RESULT: ${{ needs.documentation-and-lint.result }}
        run: python -B tools/ci_gate.py gate
