name: Factory three-way reconciliation
on:
  pull_request:
    paths:
      - 'src/lightyear_mainframe/twin_reconciliation.py'
      - 'src/lightyear_mainframe/legacy_twin.py'
      - 'src/carddemo_oracle/**'
      - 'candidate-java/src/main/java/**'
      - 'tools/legacy_twin/**'
      - 'tests/test_twin_reconciliation.py'
      - '.github/workflows/factory-reconciliation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-reconciliation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: src:.
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned GnuCOBOL (no containers)
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends gnucobol3=3.1.2-5.1ubuntu1
      - name: Focused no-suppression tests
        run: python -B -m unittest discover -s tests -p test_twin_reconciliation.py -v
      - name: Run real twin, Python, Java and platform probes
        run: python -B -m lightyear_mainframe.twin_reconciliation work/factory-reconciliation-ci
      - name: Publish engineering table
        if: always()
        run: |
          if [ -f work/factory-reconciliation-ci/reconciliation.md ]; then
            cat work/factory-reconciliation-ci/reconciliation.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve every result and failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-three-way-engineering
          path: work/factory-reconciliation-ci
          if-no-files-found: warn
