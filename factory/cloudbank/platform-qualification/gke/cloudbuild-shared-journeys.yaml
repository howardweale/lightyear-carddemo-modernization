steps:
- id: checkout-pinned-source
  name: gcr.io/cloud-builders/git
  entrypoint: /bin/bash
  args:
  - -ceu
  - |
    [[ "${_SOURCE_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
    git init /workspace/source
    git -C /workspace/source remote add origin \
      https://github.com/howardweale/lightyear-carddemo-modernization.git
    git -C /workspace/source fetch --depth=1 origin "${_SOURCE_COMMIT}"
    git -C /workspace/source checkout --detach FETCH_HEAD
    [[ "$$(git -C /workspace/source rev-parse HEAD)" == "${_SOURCE_COMMIT}" ]]
- id: run-shared-journeys
  name: gcr.io/cloud-builders/gcloud
  waitFor:
  - checkout-pinned-source
  entrypoint: /bin/bash
  env:
  - CLOUDSDK_CORE_PROJECT=$PROJECT_ID
  - KUBECONFIG=/workspace/ms67-kubeconfig
  secretEnv:
  - LIGHTYEAR_CLOUDBANK_BASELINE_EVIDENCE_KEY
  args:
  - -ceu
  - |
    trap 'rm -f /workspace/ms67-kubeconfig' EXIT
    [[ "${_IMAGE_LOCK_SHA256}" =~ ^[0-9a-f]{64}$ ]]
    [[ "${_MS64_RECEIPT_SHA256}" =~ ^[0-9a-f]{64}$ ]]
    [[ "${_PROBE_IMAGE}" =~ ^[^[:space:]]+@sha256:[0-9a-f]{64}$ ]]
    mkdir -p /workspace/inputs
    gcloud storage cp "${_IMAGE_LOCK_URI}" /workspace/inputs/image-lock.json \
      --project "$PROJECT_ID"
    gcloud storage cp "${_MS64_RECEIPT_URI}" /workspace/inputs/ms64-edge-ai.receipt.json \
      --project "$PROJECT_ID"
    printf '%s  %s\n' "${_IMAGE_LOCK_SHA256}" /workspace/inputs/image-lock.json | sha256sum --check -
    printf '%s  %s\n' "${_MS64_RECEIPT_SHA256}" /workspace/inputs/ms64-edge-ai.receipt.json | sha256sum --check -
    gcloud container clusters get-credentials "${_CLUSTER}" \
      --region "${_REGION}" --dns-endpoint --project "$PROJECT_ID"
    command -v kubectl >/dev/null
    command -v python3 >/dev/null
    python3 -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 11) else 1)'
    cd /workspace/source
    export LIGHTYEAR_PYTHON=python3
    export LIGHTYEAR_NON_PRODUCTION_ACK=I-AUTHORIZE-MS67-NON-PRODUCTION-MUTATIONS
    ./cloudbank-journeys.sh run \
      --project "$PROJECT_ID" \
      --region "${_REGION}" \
      --cluster "${_CLUSTER}" \
      --namespace "${_NAMESPACE}" \
      --image-lock /workspace/inputs/image-lock.json \
      --ms64-receipt /workspace/inputs/ms64-edge-ai.receipt.json \
      --probe-image "${_PROBE_IMAGE}" \
      --signer "${_SIGNER}" \
      --output-root "/workspace/ms67-journeys-$BUILD_ID" \
      --evidence-bucket "${_EVIDENCE_BUCKET_PREFIX}"
availableSecrets:
  secretManager:
  - versionName: projects/$PROJECT_ID/secrets/${_EVIDENCE_SECRET}/versions/latest
    env: LIGHTYEAR_CLOUDBANK_BASELINE_EVIDENCE_KEY
options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: '20'
  logging: CLOUD_LOGGING_ONLY
tags:
- ms67-shared-journeys
timeout: 3600s
