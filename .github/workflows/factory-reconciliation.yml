name: Factory three-way reconciliation
on:
  pull_request:
    paths:
      - 'src/lightyear_mainframe/twin_reconciliation.py'
      - 'src/lightyear_mainframe/legacy_twin.py'
      - 'src/carddemo_oracle/**'
      - 'candidate-java/**'
      - 'tools/legacy_twin/**'
      - 'tests/test_twin_review.py'
      - 'tests/test_twin_reconciliation.py'
      - '.github/workflows/factory-reconciliation.yml'
      - 'src/lightyear_mainframe/records.py'
      - 'src/lightyear_mainframe/zos_bindings.py'
      - 'tests/mainframe/fixtures/**'
      - 'spec/mainframe/**'
      - 'tools/check_legacy_twin.py'
      - 'src/lightyear_mainframe/posttran_invariants.py'
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.ref == 'refs/heads/main' && github.run_id || 'branch' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  public-reconciliation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: src:.
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned GnuCOBOL (no containers)
        run: |
          TWIN_FORCE_SNAPSHOT=1 bash tools/legacy_twin/install-pinned.sh
      - name: Focused no-suppression tests
        run: python -B -m unittest discover -s tests -p test_twin_reconciliation.py -v
      - name: Verify real Spring application context
        run: mvn -B -f candidate-java/pom.xml -Dtest=TwinApplicationContextTest test
      - name: Run real twin, Python, Java and platform probes
        run: python -B -m lightyear_mainframe.twin_reconciliation work/factory-reconciliation-ci
      - name: Publish engineering table
        if: always()
        run: |
          if [ -f work/factory-reconciliation-ci/reconciliation.md ]; then
            cat work/factory-reconciliation-ci/reconciliation.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve every result and failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-three-way-engineering
          path: work/factory-reconciliation-ci
          if-no-files-found: warn
