name: COPAU encrypt-on-write synthetic qualification
on: [pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.ref == 'refs/heads/main' && github.run_id || 'branch' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  synthetic:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install "psycopg[binary]>=3.2,<4"
      - name: Install exact public age archive
        run: python -B tools/ci/install_synthetic_age.py
      - name: Disposable software identities only; no artifacts or secrets
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then export PYTHONPATH='src;.'; else export PYTHONPATH='src:.'; fi
          python -B -m unittest tests.test_copau_encrypted_store -v
