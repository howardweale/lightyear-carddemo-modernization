permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.ref == 'refs/heads/main' && github.run_id || 'branch' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  contracts:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_cloudbank_ms71.py -v
      - run: python -m unittest discover -s tests -p test_cloudbank_alloydb_*.py -v
      - run: python -m unittest discover -s tests -p test_cloudbank_ms66_dual_lane.py -v
      - run: python -m unittest discover -s tests -p test_cloudbank_whole_application_equivalence.py -v
      - run: python -m unittest discover -s tests -p test_cloudbank_journeys.py -v
      - run: python -m unittest discover -s tests -p test_cloudbank_publication.py -v
      - if: runner.os == 'Linux'
        run: ./cloudbank-ms71.sh --help
      - if: runner.os == 'Windows'
        run: ./cloudbank-ms71.ps1 --help
