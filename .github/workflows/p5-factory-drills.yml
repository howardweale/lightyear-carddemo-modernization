name: P5 factory failure drills
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: p5-drills-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  report-policy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with: {python-version: '3.13'}
      - run: python -m pip install -e ".[test,control-tower]"
      - name: Test report refusal and inventory rules
        env: {PYTHONPATH: '.'}
        run: python -B -m unittest discover -s tests -p test_p5_drill_report.py -v
  disposable-drills:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with: {python-version: '3.13'}
      - run: python -m pip install -e ".[test,control-tower]"
      - name: Provision the unchanged digest-pinned execution image
        run: docker pull python:3.13-alpine@sha256:399babc8b49529dabfd9c922f2b5eea81d611e4512e3ed250d75bd2e7683f4b0
      - name: Measure real boundaries with disposable authority and stub provider
        env: {PYTHONPATH: '.'}
        run: python -B tools/ci/p5_drills.py --output work/p5-public
      - name: Require complete evidence and no unaccepted gaps
        if: always()
        env: {PYTHONPATH: '.'}
        run: python -B tools/ci/p5_drills.py --output work/p5-public --qualify
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: p5-disposable-drill-observations
          path: work/p5-public
          if-no-files-found: error
