name: Required CI gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.ref == 'refs/heads/main' && github.run_id || 'branch' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  documentation-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install PyYAML==6.0.3
      - name: Validate workflow policy and changed source syntax
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PYTHONPATH: .:src:tests
        run: |
          python -B -m unittest test_ci_gate -v
          python -B tools/ci_gate.py lint
  required-ci:
    needs: documentation-and-lint
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install PyYAML==6.0.3
      - name: Require completed green final-head workflows
        env:
          GH_TOKEN: ${{ github.token }}
          LINT_RESULT: ${{ needs.documentation-and-lint.result }}
        run: python -B tools/ci_gate.py gate
