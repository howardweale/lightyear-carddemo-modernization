name: POSTTRAN independent plan
on:
  pull_request:
    paths: ['src/lightyear_factory/posttran_second_opinion.py', 'src/lightyear_factory/posttran_preflight.py', 'tests/test_posttran_second_opinion.py', 'tests/test_posttran_preflight.py', 'docs/factory/posttran-second-opinion/**', '.github/workflows/posttran-second-opinion.yml']
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.ref == 'refs/heads/main' && github.run_id || 'branch' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  no-call-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install cryptography
      - run: python -B -m unittest test_posttran_second_opinion test_posttran_preflight
        env:
          PYTHONPATH: src:tests:.
