        - configMapRef:
            name: cloudbank-runtime
        - secretRef:
            name: "{{SECRET_CHATBOT}}"
        env:
        - {name: SERVER_PORT, value: "8080"}
        - {name: SPRING_CLOUD_CONFIG_ENABLED, value: "false"}
        - {name: SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT, value: org.hibernate.dialect.PostgreSQLDialect}
        - {name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED, value: "true"}
        - {name: MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS, value: never}
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: http
          failureThreshold: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: http
          periodSeconds: 10
          timeoutSeconds: 2
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: chatbot
  namespace: "{{NAMESPACE}}"
spec:
  selector:
    app.kubernetes.io/name: chatbot
  ports:
  - name: http
    port: 8080
    targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: chatbot
  namespace: "{{NAMESPACE}}"
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: chatbot
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: "{{NAMESPACE}}"
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cloudbank-bounded-traffic
  namespace: "{{NAMESPACE}}"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: cloudbank
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/part-of: cloudbank
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: "{{INGRESS_NAMESPACE}}"
  egress:
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/part-of: cloudbank
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - ipBlock:
        cidr: "{{DATABASE_EGRESS_CIDR}}"
    ports:
    - protocol: TCP
      port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chatbot-model-egress
  namespace: "{{NAMESPACE}}"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: chatbot
  policyTypes:
  - Egress
  egress:
  - to:
    - ipBlock:
        cidr: "{{MODEL_EGRESS_CIDR}}"
    ports:
    - protocol: TCP
      port: 443
