name: Business rules offline
on:
  pull_request:
    paths-ignore: ['**/*.md']
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.ref == 'refs/heads/main' && github.run_id || 'branch' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  offline-rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install 'cryptography>=46,<47' 'mcp==2.2.0'
      - name: Focused evaluator, graph and Tower tests
        env:
          PYTHONPATH: src:.:tests
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m unittest test_business_rules test_knowledge_graph test_verify_graph_projection test_decision_console test_decision_console_http test_verify_graph test_carddemo_zos_tower.TowerIntakeTests.test_business_rules_unavailable_without_reading_confidential_catalogue test_carddemo_zos_tower.TowerIntakeTests.test_no_record_values_in_any_route_sse_mcp_or_export
      - name: Replay public acceptance receipts
        env:
          PYTHONPATH: src:.
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B tools/replay_business_rules_demo.py
