name: Rebuild generated status after merge
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/factory/current-status.json'
      - 'docs/factory/current-status.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: status-event-${{ github.run_id }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  rebuild-status:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: factory-generated-status-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install 'cryptography>=46,<47'
      - name: Rebuild and propose status-only draft PR
        env:
          PYTHONPATH: src:.
          GH_TOKEN: ${{ github.token }}
        run: python -B tools/rebuild_main_status.py
