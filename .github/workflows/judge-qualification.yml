name: Judge and factory qualification

on:
  pull_request:
    paths:
      - 'src/lightyear_calibration/**'
      - 'factory/idempiere/qualification/**'
      - 'factory/idempiere/qualification-ms94/**'
      - 'factory/idempiere/qualification-ms94-v3/**'
      - 'factory/idempiere/stage-b-v4/**'
      - 'tools/ms94_*.py'
      - 'tests/test_ms94_*.py'
      - 'factory/idempiere/repeatability/**'
      - 'tools/*qualification*'
      - 'tools/journey*'
      - 'tests/test_*qualification*'
      - 'tests/test_qualified*'
      - 'tests/test_journey*'
      - 'tests/test_procurement_scope.py'
      - '.github/workflows/judge-qualification.yml'
      - 'src/lightyear_factory/transport_journal.py'
      - 'src/lightyear_factory/controller_count_accounting.py'
      - 'src/lightyear_factory/count_charge_account.py'
      - 'src/lightyear_factory/count_request_bound.py'
      - 'src/lightyear_factory/flex_billing.py'
      - 'src/lightyear_execution/human_drill_dispatch.py'
      - 'src/lightyear_execution/public_drill_outputs.py'
      - 'src/lightyear_execution/public_drill_runtime.py'
      - 'src/lightyear_execution/tower_drill_admission.py'
      - 'src/lightyear_execution/tower_drill_context.py'
      - 'src/lightyear_execution/tower_drill_reservation.py'
      - 'src/lightyear_execution/tower_drill_roles.py'
  push:
    branches: [main]
    paths:
      - 'src/lightyear_calibration/**'
      - 'factory/idempiere/qualification/**'
      - 'factory/idempiere/qualification-ms94/**'
      - 'factory/idempiere/qualification-ms94-v3/**'
      - 'factory/idempiere/stage-b-v4/**'
      - 'tools/ms94_*.py'
      - 'tests/test_ms94_*.py'
      - 'factory/idempiere/repeatability/**'
      - 'tools/*qualification*'
      - 'tools/journey*'
      - 'tests/test_*qualification*'
      - 'tests/test_qualified*'
      - 'tests/test_journey*'
      - 'tests/test_procurement_scope.py'
      - '.github/workflows/judge-qualification.yml'
      - 'src/lightyear_factory/transport_journal.py'
      - 'src/lightyear_factory/controller_count_accounting.py'
      - 'src/lightyear_factory/count_charge_account.py'
      - 'src/lightyear_factory/count_request_bound.py'
      - 'src/lightyear_factory/flex_billing.py'
      - 'src/lightyear_execution/human_drill_dispatch.py'
      - 'src/lightyear_execution/public_drill_outputs.py'
      - 'src/lightyear_execution/public_drill_runtime.py'
      - 'src/lightyear_execution/tower_drill_admission.py'
      - 'src/lightyear_execution/tower_drill_context.py'
      - 'src/lightyear_execution/tower_drill_reservation.py'
      - 'src/lightyear_execution/tower_drill_roles.py'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.ref == 'refs/heads/main' && github.run_id || 'branch' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  bounded-equipment-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python -m pip install -e '.[agent]'
      - name: Test without generation or native database provisioning
        env:
          PYTHONPATH: 'src:.'
        run: >-
          python -m unittest
          tests.test_judge_qualification tests.test_qualified_judge_versions
          tests.test_qualification_observer tests.test_qualification_observer_v3 tests.test_qualification_observer_v4
          tests.test_journey_builder_tools tests.test_procurement_scope
          tests.test_journey_support_java tests.test_qualification_transport_policy
          tests.test_measured_factory tests.test_repeatability tests.test_transaction_observer
          tests.test_ms94_equipment tests.test_ms94_controller tests.test_ms94_review_revision tests.test_ms94_snapshot_execution
          tests.test_ms94_stage_b_v4
