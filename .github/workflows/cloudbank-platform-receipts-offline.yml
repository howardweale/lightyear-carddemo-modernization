name: CloudBank platform receipts offline
on:
  pull_request:
    paths:
      - 'src/lightyear_data/cloudbank_platform_*.py'
      - 'src/lightyear_cloud_runner/signing.py'
      - 'src/lightyear_cloud_runner/__init__.py'
      - 'src/lightyear_data/__init__.py'
      - 'tools/cloudbank_platform_receipt.py'
      - 'tests/test_cloudbank_platform_receipt.py'
      - 'factory/cloudbank/platform-qualification/platform-contract.json'
      - '.github/workflows/cloudbank-platform-receipts-offline.yml'
  push:
    branches: [main]
    paths:
      - 'src/lightyear_data/cloudbank_platform_*.py'
      - 'src/lightyear_cloud_runner/signing.py'
      - 'src/lightyear_cloud_runner/__init__.py'
      - 'src/lightyear_data/__init__.py'
      - 'tools/cloudbank_platform_receipt.py'
      - 'tests/test_cloudbank_platform_receipt.py'
      - 'factory/cloudbank/platform-qualification/platform-contract.json'
      - '.github/workflows/cloudbank-platform-receipts-offline.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.ref == 'refs/heads/main' && github.run_id || 'branch' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  public-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - run: python -m pip install cryptography==50.0.1
      - name: Public plan and receipt negative controls; no private keys or signing
        env:
          PYTHONPATH: src:.:tests
        run: python -B -m unittest test_cloudbank_platform_receipt -v
