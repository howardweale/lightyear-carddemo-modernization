name: Declarative services and API journeys
on:
  pull_request:
    paths:
      - 'src/lightyear_workflow/service_pack.py'
      - 'src/lightyear_data/**'
      - 'src/lightyear_qualification/**'
      - 'spec/service-packs/**'
      - 'tests/test_service_pack.py'
      - 'tests/test_cloudbank_journeys.py'
      - 'tests/test_runtime_gate_qualification.py'
      - 'pyproject.toml'
      - '.github/workflows/service-packs.yml'
      - 'src/lightyear_factory/transport_journal.py'
      - 'src/lightyear_factory/controller_count_accounting.py'
      - 'src/lightyear_factory/count_charge_account.py'
      - 'src/lightyear_factory/count_request_bound.py'
      - 'src/lightyear_factory/flex_billing.py'
      - 'src/lightyear_execution/human_drill_dispatch.py'
      - 'src/lightyear_execution/public_drill_outputs.py'
      - 'src/lightyear_execution/public_drill_runtime.py'
      - 'src/lightyear_execution/tower_drill_admission.py'
      - 'src/lightyear_execution/tower_drill_context.py'
      - 'src/lightyear_execution/tower_drill_reservation.py'
      - 'src/lightyear_execution/tower_drill_roles.py'
  push:
    branches: [main]
    paths:
      - 'src/lightyear_workflow/service_pack.py'
      - 'src/lightyear_data/**'
      - 'src/lightyear_qualification/**'
      - 'spec/service-packs/**'
      - 'tests/test_service_pack.py'
      - 'tests/test_cloudbank_journeys.py'
      - 'tests/test_runtime_gate_qualification.py'
      - 'pyproject.toml'
      - '.github/workflows/service-packs.yml'
      - 'src/lightyear_factory/transport_journal.py'
      - 'src/lightyear_factory/controller_count_accounting.py'
      - 'src/lightyear_factory/count_charge_account.py'
      - 'src/lightyear_factory/count_request_bound.py'
      - 'src/lightyear_factory/flex_billing.py'
      - 'src/lightyear_execution/human_drill_dispatch.py'
      - 'src/lightyear_execution/public_drill_outputs.py'
      - 'src/lightyear_execution/public_drill_runtime.py'
      - 'src/lightyear_execution/tower_drill_admission.py'
      - 'src/lightyear_execution/tower_drill_context.py'
      - 'src/lightyear_execution/tower_drill_reservation.py'
      - 'src/lightyear_execution/tower_drill_roles.py'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.ref == 'refs/heads/main' && github.run_id || 'branch' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate and plan without runtime access
        env:
          PYTHONPATH: src
        run: |
          python -m lightyear_workflow.service_pack validate spec/service-packs/order-approval.pack.json
          python -m lightyear_workflow.service_pack plan src/lightyear_data/packs/cloudbank.services.json
      - name: Verify capabilities and existing acceptance paths
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_service_pack tests.test_cloudbank_journeys tests.test_runtime_gate_qualification tests.test_batch_pack -v
