name: COBOL codec proposal checks
on:
  pull_request:
    paths:
      - 'factory/cobol-runtime/**'
      - 'tests/fixtures/cobol-runtime/**'
      - 'spec/cobol-runtime/2026-11-15/**'
      - 'tools/run_cobol_codec_vectors.py'
      - 'tests/test_cobol_codec_vector_schema.py'
      - '.github/workflows/cobol-codecs.yml'
  push:
    branches: [main]
    paths:
      - 'factory/cobol-runtime/**'
      - 'tests/fixtures/cobol-runtime/**'
      - 'spec/cobol-runtime/2026-11-15/**'
      - 'tools/run_cobol_codec_vectors.py'
      - 'tests/test_cobol_codec_vector_schema.py'
      - '.github/workflows/cobol-codecs.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.ref == 'refs/heads/main' && github.run_id || 'branch' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  codecs:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Compile only trusted library and public harness
        shell: bash
        run: |
          mkdir codec-classes
          javac -encoding UTF-8 --release 21 -Xlint:all -d codec-classes factory/cobol-runtime/src/org/lightyear/cobol/RecordNumbers.java factory/cobol-runtime/test/org/lightyear/cobol/RecordNumbersTest.java
      - name: Author derivations and arena invariants; not qualification
        shell: bash
        run: python -B tools/run_cobol_codec_vectors.py --vectors tests/fixtures/cobol-runtime/codecs-author.json --profile spec/cobol-runtime/2026-11-15/PROFILE.json --classes codec-classes
      - name: Claude independent vectors; exact pinned bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download full-intcalc-cobol-runtime-slice1a-implementation-proposal-20261115-r2 --repo howardweale/lightyear-carddemo-modernization --pattern codecs-independent-claude.json --dir "$RUNNER_TEMP/claude-codec-vectors"
          python -B tools/run_cobol_codec_vectors.py --vectors "$RUNNER_TEMP/claude-codec-vectors/codecs-independent-claude.json" --independent-sha256 8c422ad1bce09625fc025bd2d1c8c0c1f4060ff497dc59a22a882d2b9f8c789d --profile spec/cobol-runtime/2026-11-15/PROFILE.json --classes codec-classes
      - name: Vector admission negatives without Java execution
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then export PYTHONPATH='src;.;tests'; else export PYTHONPATH='src:.:tests'; fi
          python -B -m unittest test_cobol_codec_vector_schema
