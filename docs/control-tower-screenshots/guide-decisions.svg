<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="415" viewBox="0 0 1440 415"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#7c899c"/></marker></defs><rect width="1440" height="415" fill="white"/><text x="24" y="42" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="bold" fill="#087e8b">HUMAN DECISION REVIEW</text><rect x="24" y="70" width="324" height="170" rx="18" fill="#f5f7fb" stroke="#dce2ed" stroke-width="2"/><circle cx="57" cy="106" r="21" fill="#087e8b"/><text x="45" y="115" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="bold" fill="white">1</text><text x="89" y="116" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="bold" fill="#182638">Open request</text><text x="48" y="162" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="normal" fill="#46566b">Correct scope and role</text><text x="48" y="197" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="normal" fill="#46566b">Exact evidence and hashes</text><path d="M352 155 L374 155" fill="none" stroke="#7c899c" stroke-width="4" marker-end="url(#arrow)"/><rect x="380" y="70" width="324" height="170" rx="18" fill="#f5f7fb" stroke="#dce2ed" stroke-width="2"/><circle cx="413" cy="106" r="21" fill="#087e8b"/><text x="401" y="115" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="bold" fill="white">2</text><text x="445" y="116" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="bold" fill="#182638">Assess</text><text x="404" y="162" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="normal" fill="#46566b">Outcome · reason</text><text x="404" y="197" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="normal" fill="#46566b">Owner · review date</text><path d="M708 155 L730 155" fill="none" stroke="#7c899c" stroke-width="4" marker-end="url(#arrow)"/><rect x="736" y="70" width="324" height="170" rx="18" fill="#f5f7fb" stroke="#dce2ed" stroke-width="2"/><circle cx="769" cy="106" r="21" fill="#087e8b"/><text x="757" y="115" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="bold" fill="white">3</text><text x="801" y="116" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="bold" fill="#182638">Record once</text><text x="760" y="162" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="normal" fill="#46566b">Record decision</text><text x="760" y="197" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="normal" fill="#46566b">Then check the event</text><path d="M1064 155 L1086 155" fill="none" stroke="#7c899c" stroke-width="4" marker-end="url(#arrow)"/><rect x="1092" y="70" width="324" height="170" rx="18" fill="#f5f7fb" stroke="#dce2ed" stroke-width="2"/><circle cx="1125" cy="106" r="21" fill="#087e8b"/><text x="1113" y="115" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="bold" fill="white">4</text><text x="1157" y="116" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="bold" fill="#182638">Confirm</text><text x="1116" y="162" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="normal" fill="#46566b">Decision history</text><text x="1116" y="197" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="normal" fill="#46566b">Current proof and trust</text><text x="24" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="bold" fill="#935712">IF THE ITEM IS STALE</text><text x="24" y="335" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="normal" fill="#182638">Refresh, reopen and reassess. Do not replay a stale submission.</text><text x="24" y="383" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="normal" fill="#182638">A recorded decision does not start a campaign or replace release prerequisites.</text></svg>