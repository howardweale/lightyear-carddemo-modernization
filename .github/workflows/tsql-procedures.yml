name: T-SQL public corpus offline checks
on:
  pull_request:
    paths:
      - 'src/lightyear_data/tsql_procedures/**'
      - 'data-modernization/tsql-procedures/**'
      - 'tools/tsql_scriptdom/**'
      - 'tools/*tsql_native.py'
      - 'tests/test_tsql*.py'
      - '.github/workflows/tsql-procedures.yml'
  push:
    branches: [main]
    paths:
      - 'src/lightyear_data/tsql_procedures/**'
      - 'data-modernization/tsql-procedures/**'
      - 'tools/tsql_scriptdom/**'
      - 'tools/*tsql_native.py'
      - 'tests/test_tsql*.py'
      - '.github/workflows/tsql-procedures.yml'
permissions:
  contents: read
jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[control-tower]'
      - name: Public-fixture tests; no database or model calls
        run: python -B -m unittest discover -s tests -p 'test_tsql*.py' -v
