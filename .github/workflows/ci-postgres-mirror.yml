name: Mirror pinned CI PostgreSQL
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.run_id || 'branch' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  mirror:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Copy immutable official manifest and all platforms without conversion
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y skopeo
          digest='sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea'
          source="docker://public.ecr.aws/docker/library/postgres@$digest"
          destination='docker://ghcr.io/howardweale/lightyear-ci-postgres'
          authfile="$RUNNER_TEMP/ghcr-mirror-auth.json"
          trap 'rm -f "$authfile"' EXIT
          printf '%s' "$GHCR_TOKEN" | skopeo login --authfile "$authfile" --username "$GHCR_USER" --password-stdin ghcr.io
          skopeo copy --all --preserve-digests --authfile "$authfile" "$source" "$destination:pinned-721873c34ceb"
          skopeo inspect --raw --authfile "$authfile" "$destination@$digest" > "$RUNNER_TEMP/postgres-manifest.json"
          actual="sha256:$(sha256sum "$RUNNER_TEMP/postgres-manifest.json" | cut -d ' ' -f1)"
          test "$actual" = "$digest"
          printf 'Verified mirror manifest %s\n' "$actual" >> "$GITHUB_STEP_SUMMARY"
