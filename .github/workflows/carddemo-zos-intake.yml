name: CardDemo zOS folder intake rehearsal
on:
  pull_request:
    paths-ignore: ['**/*.md']
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.ref == 'refs/heads/main' && github.run_id || 'branch' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  public-only-rehearsal:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: candidate-java/pom.xml
      - run: python -m pip install -e ".[control-tower]"
      - run: mvn -B -f candidate-java/pom.xml package
      - name: Decoder, refusal, custody, Console and offline replay regressions
        env:
          PYTHONPATH: src
          PYTHONUTF8: '1'
        run: python -m unittest discover -s tests -p test_zos_intake.py -v
      - name: Rehearse complete public synthetic chain without Docker or models
        shell: bash
        env:
          PYTHONPATH: src
          PYTHONUTF8: '1'
        run: |
          python -m lightyear_mainframe init-intake-key work/mainframe/authority/rehearsal.pem
          python -m lightyear_mainframe rehearse-intake --key work/mainframe/authority/rehearsal.pem --jar candidate-java/target/carddemo-spring-batch-candidate-0.1.0-SNAPSHOT.jar
          test -z "$(git status --porcelain -- work/mainframe/arrivals)"
          git diff --exit-code
      # Do not upload arrivals, execution logs, archives, or signing material.
