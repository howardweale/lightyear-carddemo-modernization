name: Retain Verify graph acceptance
on:
  workflow_run:
    workflows: ['Lightyear Verify zero-model acceptance']
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: verify-graph-retention-${{ github.run_id }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  retain:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    concurrency:
      group: verify-graph-retention-source-${{ github.event.workflow_run.id }}
      cancel-in-progress: false
    steps:
      - name: Record GitHub quota at job start
        timeout-minutes: 1
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          QUOTA_PHASE: start
        run: &quota_sample |
          python -I -B - <<'PY'
          import datetime, os, re, subprocess
          from pathlib import Path

          sample = "status=unavailable"
          try:
              p = subprocess.run(["gh", "api", "--include", "rate_limit", "--hostname", "github.com"], capture_output=True,
                                 check=False, timeout=12)
              header, boundary, _ = p.stdout.replace(b"\r\n", b"\n").partition(b"\n\n")
              if p.returncode == 0 and boundary and len(header) <= 16384:
                  values = {}
                  for key in ("used", "remaining", "reset", "resource"):
                      token = rb"[a-z_]+" if key == "resource" else rb"[0-9]{1,20}"
                      pattern = rb"^x-ratelimit-" + key.encode() + rb":[ \t]*(" + token + rb")[ \t]*$"
                      matches = re.findall(pattern, header, re.IGNORECASE | re.MULTILINE)
                      if len(matches) == 1:
                          values[key] = matches[0].decode("ascii").lower()
                  if all(k in values for k in ("used", "remaining", "reset")):
                      sample = ("status=observed used={used} remaining={remaining} reset={reset} "
                                "resource={resource}").format(**{"resource":"unknown", **values})
          except (OSError, subprocess.TimeoutExpired):
              pass
          now = datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds")
          line = ("github-quota " + now + " phase=" + os.environ["QUOTA_PHASE"] +
                  " job=" + os.environ["GITHUB_JOB"] + " os=" + os.environ["RUNNER_OS"] +
                  " arch=" + os.environ["RUNNER_ARCH"] + " run=" + os.environ["GITHUB_RUN_ID"] +
                  " attempt=" + os.environ["GITHUB_RUN_ATTEMPT"] + " " + sample)
          print(line)
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as f:
              f.write(line + "\n")
          PY
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Retain verified bytes using trusted main code only
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
          PYTHONPATH: src:.
        run: python -B -m tools.ci.verify_graph_retention "$SOURCE_RUN" work/verify-graph-retention
      - uses: actions/upload-artifact@v7
        with:
          name: verify-graph-retention-publication-${{ github.event.workflow_run.id }}
          path: work/verify-graph-retention/publication/*.json
          if-no-files-found: error
          retention-days: 90
      - name: Record GitHub quota at job end
        if: always()
        timeout-minutes: 1
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          QUOTA_PHASE: end
        run: *quota_sample
