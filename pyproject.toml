[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lightyear-carddemo-oracle"
version = "0.9.0"
description = "z/OSMF-ready evidence-governed modernization factory for CardDemo"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
carddemo-oracle = "carddemo_oracle.cli:main"
lightyear-graph = "lightyear_knowledge_graph.cli:main"
lightyear-factory = "lightyear_factory.cli:main"
lightyear-runtime = "lightyear_runtime.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
