name: CMS Pricer F0 feasibility
on:
  pull_request:
    paths:
      - 'tools/cms/**'
      - 'docs/cms/**'
      - 'tests/test_cms*'
      - '.github/workflows/cms-pricer-feasibility.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.ref == 'refs/heads/main' && github.run_id || 'branch' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test archive and source inventory
        env:
          PYTHONPATH: .:tests
        run: python -B -m unittest test_cms_inventory test_cms_f0_smoke test_cms_f0_policy -v
      - name: Install pinned GnuCOBOL 3.1.2
        run: bash tools/legacy_twin/install-pinned.sh
      - name: Compile byte-identical public CMS source
        run: python -B -m tools.cms.f0_probe --pins docs/cms/downloads.json --compile
      - name: Five generated F0 calls (hashes only)
        run: python -B -m tools.cms.f0_smoke
      - name: Produce allowlisted metadata only; withhold all raw compiler logs
        if: always()
        run: python -B -m tools.cms.f0_policy
      - name: Retain feasibility metadata (no source or pricing output)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cms-f0-compile
          path: work/cms/f0/public/receipt.json
          if-no-files-found: error
          retention-days: 14
