name: Public evidence retention
on:
  pull_request:
    paths:
      - 'docs/factory/evidence-retention-*.json'
      - 'tools/verify_public_retention.py'
      - '.github/workflows/public-evidence-retention.yml'
permissions:
  contents: read
concurrency:
  group: public-retention-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  download-and-hash:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify the three approved original receipts
        run: python3 -B tools/verify_public_retention.py docs/factory/evidence-retention-2026-10-16.json retention-verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: public-retention-verification
          path: retention-verification.json
          retention-days: 90
