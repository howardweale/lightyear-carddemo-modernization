name: INTCALC unsigned review packet
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.run_id || 'pr' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  unsigned-packet:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[control-tower]'
      - name: Validate exact templates and synthetic live/decided overlap refusals
        run: |
          python -m unittest tests.test_intcalc_review_packet tests.test_factory_content_supersessions tests.test_bind_next_intcalc_request
          python -m tools.intcalc_review_packet
