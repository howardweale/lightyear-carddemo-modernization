name: Factory scenario coverage
on:
  pull_request:
    paths:
      - 'src/lightyear_mainframe/**'
      - 'src/lightyear_business_rules/coverage.py'
      - 'tools/check_scenario_coverage.py'
      - 'tests/test_scenario_coverage.py'
      - '.github/workflows/factory-scenario-coverage.yml'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.ref == 'refs/heads/main' && github.run_id || 'branch' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  public-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: src:.:tests
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: bash tools/legacy_twin/install-pinned.sh
      - run: python -B -m unittest test_scenario_coverage test_legacy_twin
      - run: python -B -m tools.check_scenario_coverage work/scenario-coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-scenario-coverage
          path: work/scenario-coverage
