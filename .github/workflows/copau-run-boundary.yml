name: COPAU public run boundary
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: copau-boundary-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  launch-refusals:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Record GitHub quota at job start
        timeout-minutes: 1
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          QUOTA_PHASE: start
        run: &quota_sample |
          python -I -B - <<'PY'
          import datetime, os, re, subprocess
          from pathlib import Path

          sample = "status=unavailable"
          try:
              p = subprocess.run(["gh", "api", "--include", "rate_limit", "--hostname", "github.com"], capture_output=True,
                                 check=False, timeout=12)
              header, boundary, _ = p.stdout.replace(b"\r\n", b"\n").partition(b"\n\n")
              if p.returncode == 0 and boundary and len(header) <= 16384:
                  values = {}
                  for key in ("used", "remaining", "reset", "resource"):
                      token = rb"[a-z_]+" if key == "resource" else rb"[0-9]{1,20}"
                      pattern = rb"^x-ratelimit-" + key.encode() + rb":[ \t]*(" + token + rb")[ \t]*$"
                      matches = re.findall(pattern, header, re.IGNORECASE | re.MULTILINE)
                      if len(matches) == 1:
                          values[key] = matches[0].decode("ascii").lower()
                  if all(k in values for k in ("used", "remaining", "reset")):
                      sample = ("status=observed used={used} remaining={remaining} reset={reset} "
                                "resource={resource}").format(**{"resource":"unknown", **values})
          except (OSError, subprocess.TimeoutExpired):
              pass
          now = datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds")
          line = ("github-quota " + now + " phase=" + os.environ["QUOTA_PHASE"] +
                  " job=" + os.environ["GITHUB_JOB"] + " os=" + os.environ["RUNNER_OS"] +
                  " arch=" + os.environ["RUNNER_ARCH"] + " run=" + os.environ["GITHUB_RUN_ID"] +
                  " attempt=" + os.environ["GITHUB_RUN_ATTEMPT"] + " " + sample)
          print(line)
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as f:
              f.write(line + "\n")
          PY
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with: {python-version: '3.13'}
      - run: python -m pip install -e ".[test,control-tower]"
      - name: Refuse graph files, tools and memory before admission effects
        env: {PYTHONPATH: '.'}
        run: python -B -m unittest discover -s tests -p "test_copau_run_boundary.py" -v
      - name: Record GitHub quota at job end
        if: always()
        timeout-minutes: 1
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          QUOTA_PHASE: end
        run: *quota_sample
  public-index:
    needs: launch-refusals
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Record GitHub quota at job start
        timeout-minutes: 1
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          QUOTA_PHASE: start
        run: *quota_sample
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: '3.13'}
      - run: python -m pip install -e ".[test,control-tower]"
      - name: Capture the historical catalog for this main commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B -m tools.ci.copau_history_snapshot
      - name: Retain the immutable main catalog
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == '1'
        uses: actions/upload-artifact@v6
        with:
          name: copau-catalog-${{ github.sha }}
          path: ${{ runner.temp }}/historical-catalog.json
          retention-days: 90
          if-no-files-found: error
          overwrite: false
      - name: Materialize the public Windows review layout
        run: |
          git -c core.autocrlf=false -c core.longpaths=true worktree add --detach C:/Users/howar/Lightyear/COPAUReview-v1/repository HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Public layout creation refused' }
      - name: Assemble only public surfaces and emit an unreviewed index
        working-directory: C:/Users/howar/Lightyear/COPAUReview-v1/repository
        env:
          PYTHONPATH: '.'
          GH_TOKEN: ${{ github.token }}
        run: python -B tools/ci/copau_run_boundary.py --out C:/Users/howar/Lightyear/COPAUReview-v1/public
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          retention-days: 90
          name: copau-public-run-boundary
          path: C:/Users/howar/Lightyear/COPAUReview-v1/public
          if-no-files-found: error
          include-hidden-files: true
      - name: Record GitHub quota at job end
        if: always()
        timeout-minutes: 1
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          QUOTA_PHASE: end
        run: *quota_sample
