name: carddemo-slice-1
services:
  postgres:
    image: ${CARDDEMO_POSTGRES_IMAGE:-public.ecr.aws/docker/library/postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea}
    environment:
      POSTGRES_DB: carddemo
      POSTGRES_USER: carddemo
      POSTGRES_PASSWORD: disposable-public-demo
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U carddemo -d carddemo"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes: [database:/var/lib/postgresql]
  seed:
    build: {context: ../.., dockerfile: factory/carddemo-web/Dockerfile.seed}
    environment:
      CARDDEMO_DSN: postgresql://carddemo:disposable-public-demo@postgres/carddemo
    depends_on:
      postgres: {condition: service_healthy}
    volumes: [fixture:/fixture]
  service:
    build: {context: ../.., dockerfile: factory/carddemo-web/Dockerfile.service}
    environment:
      CARDDEMO_JDBC_URL: jdbc:postgresql://postgres:5432/carddemo
      CARDDEMO_DB_USER: carddemo
      CARDDEMO_DB_PASSWORD: disposable-public-demo
      # Empty means an ephemeral application-only session key, discarded at restart.
      CARDDEMO_SESSION_KEY: ${CARDDEMO_SESSION_KEY:-}
    depends_on:
      seed: {condition: service_completed_successfully}
  ui:
    build: {context: ../.., dockerfile: factory/carddemo-web/Dockerfile.ui}
    depends_on: [service]
    ports: ["127.0.0.1:${CARDDEMO_PORT:-8080}:80"]
volumes:
  database:
  fixture:
