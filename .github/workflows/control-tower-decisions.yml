name: Control Tower human decisions
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  signed-decisions:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install decision signing support
        run: python -m pip install -e ".[control-tower,agent]"
      - name: Verify signed human decisions, headless action plans, and read-only projections
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -p test_control_tower_decisions.py -v
          python -m unittest discover -s tests -p 'test_decision_console*.py' -v
          python -m unittest tests.test_tower_status_export tests.test_b06_tower -v
          node --check knowledge/viewer/decision-console.js
          python -m unittest discover -s tests -p test_evidence_action_plan.py -v
          python -m unittest discover -s tests -p test_run_index.py -v
          python -m unittest discover -s tests -p test_cloudbank_workflow_execution.py -v
          python -m unittest discover -s tests -p test_cloudbank_six_actions.py -v
          python -m unittest discover -s tests -p test_graph_explorer.py -v
          python -m unittest discover -s tests -p test_live_control_tower.py -v
          python -m unittest discover -s tests -p test_comparator_escape.py -v
          python -m unittest discover -s tests -p test_workflow_campaigns.py -v
          python -m unittest discover -s tests -p test_workflow_history.py -v
          python -m unittest discover -s tests -p 'test_paired_campaign*.py' -v
          python -m unittest discover -s tests -p 'test_paired_core100*.py' -v
          python -m unittest discover -s tests -p 'test_paired_types260*.py' -v
          python -m unittest discover -s tests -p test_oracle_paired_coverage.py -v
          node --check knowledge/viewer/paired.js
          node --check knowledge/viewer/context.js
          node --check knowledge/viewer/campaign.js
          node --check knowledge/viewer/app.js
          node --check knowledge/viewer/decisions.js
          node --check knowledge/viewer/workflow.js
          node --check knowledge/viewer/execution.js
          node --check knowledge/viewer/convergence.js
          node --check knowledge/viewer/run.js
          python -m lightyear_workflow verify --output control-tower/action-plan.snapshot.json.gz
  browser-inspection:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install campaign signing support
        run: python -m pip install -e ".[control-tower]"
      - name: Use the official Ubuntu archive for browser dependencies
        run: |
          # The hosted runner's Azure mirror can stall before browser tests start.
          # Preserve Ubuntu's suites, components and Signed-By verification.
          sudo sed -i 's|^URIs:.*|URIs: https://archive.ubuntu.com/ubuntu/|' /etc/apt/sources.list.d/ubuntu.sources
          printf 'Acquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "2";\n' | sudo tee /etc/apt/apt.conf.d/80lightyear-download-timeouts
      - name: Install pinned browser test dependencies
        working-directory: tests/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit
      - name: Inspect CloudBank evidence in desktop and mobile browsers
        working-directory: tests/browser
        run: |
          npm test
          node paired.mjs
          node decision-console.mjs
          node b06.mjs
      - name: Retain browser screenshots and inspection results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ms72-browser-inspection
          path: work/browser-inspection/
          if-no-files-found: error
