name: CardDemo gap and SQL source proof
on:
  pull_request:
    paths: ["factory/carddemo-web/**", "src/lightyear_data/carddemo/**", "src/lightyear_mainframe/records.py", "spec/modernization/carddemo-screens/**", "spec/modernization/carddemo-data/**", "tests/test_carddemo_web*", "tests/browser/carddemo-*.mjs", "tools/ci_postgres_image.py", "tools/check_carddemo_sql_order.py", "tools/carddemo_web_gaps.py", "docs/modernization/carddemo-slice-gaps-*.json", "tools/check_carddemo_java_trace.py", "tools/carddemo_java_proof.py", "tools/carddemo_idiomatic_status.py", "tools/carddemo_account_*.py", "tests/test_carddemo_account_*.py", "docs/modernization/carddemo-account*", "docs/modernization/carddemo-account-evidence-2026-10-19/**", "docs/modernization/carddemo-cosgn00*", "docs/modernization/carddemo-cosgn00-evidence-2026-10-18/**", ".github/workflows/carddemo-web.yml", ".github/workflows/carddemo-gap-proof.yml", "tools/carddemo_status_record.py", "tools/release_status_records.py"]
  push:
    branches: [main]
    paths: ["factory/carddemo-web/**", "src/lightyear_data/carddemo/**", "src/lightyear_mainframe/records.py", "spec/modernization/carddemo-screens/**", "spec/modernization/carddemo-data/**", "tests/test_carddemo_web*", "tests/browser/carddemo-*.mjs", "tools/ci_postgres_image.py", "tools/check_carddemo_sql_order.py", "tools/carddemo_web_gaps.py", "docs/modernization/carddemo-slice-gaps-*.json", "tools/check_carddemo_java_trace.py", "tools/carddemo_java_proof.py", "tools/carddemo_idiomatic_status.py", "tools/carddemo_account_*.py", "tests/test_carddemo_account_*.py", "docs/modernization/carddemo-account*", "docs/modernization/carddemo-account-evidence-2026-10-19/**", "docs/modernization/carddemo-cosgn00*", "docs/modernization/carddemo-cosgn00-evidence-2026-10-18/**", ".github/workflows/carddemo-web.yml", ".github/workflows/carddemo-gap-proof.yml", "tools/carddemo_status_record.py", "tools/release_status_records.py"]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.ref == 'refs/heads/main' && github.run_id || 'branch' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  gap-and-sql-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Verify dated gap bindings and byte-key SQL ordering
        env:
          PYTHONPATH: src:tests:.
        run: |
          python -B -m unittest test_carddemo_web_gaps -v
          python -B tools/check_carddemo_sql_order.py
