---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: cloudbank-ms67-letsencrypt
spec:
  acme:
    email: "{{LETSENCRYPT_EMAIL}}"
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: cloudbank-ms67-acme
    solvers:
    - http01:
        ingress:
          ingressClassName: nginx
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudbank
  namespace: "{{NAMESPACE}}"
  annotations:
    cert-manager.io/cluster-issuer: cloudbank-ms67-letsencrypt
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - "{{TLS_HOSTNAME}}"
    secretName: cloudbank-ms67-tls
  rules:
  - host: "{{TLS_HOSTNAME}}"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: testrunner
            port:
              number: 8080
---
