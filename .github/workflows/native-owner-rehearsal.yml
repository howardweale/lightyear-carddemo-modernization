name: Native owner NO-KEY rehearsal fixtures
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.ref == 'refs/heads/main' && github.run_id || 'branch' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  public-spawn:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.12.16'
          - os: windows-2025
            python: '3.12.10'
          - os: macos-15
            python: '3.12.10'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Record exact CI interpreter
        run: python -c "import sys; print(sys.version)"
      - name: Install public verification dependency for adapter fixtures
        run: python -m pip install cryptography==46.0.3
      - name: Disposable process trees and typed adapter fault sequences
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            export PYTHONPATH='src;.;tests'
          else
            export PYTHONPATH='src:.:tests'
          fi
          python -B -m unittest test_mac_owner_process test_native_owner_fault_sequences test_mac_owner_native -v
