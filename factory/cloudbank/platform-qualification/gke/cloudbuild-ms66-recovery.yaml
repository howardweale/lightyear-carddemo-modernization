steps:
- id: checkout-pinned-controller
  name: gcr.io/cloud-builders/git
  entrypoint: /bin/bash
  args:
  - -ceu
  - |
    [[ "${_SOURCE_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
    git init /workspace/controller
    git -C /workspace/controller remote add origin \
      https://github.com/howardweale/lightyear-carddemo-modernization.git
    git -C /workspace/controller fetch --depth=1 origin "${_SOURCE_COMMIT}"
    git -C /workspace/controller checkout --detach FETCH_HEAD
    [[ "$$(git -C /workspace/controller rev-parse HEAD)" == "${_SOURCE_COMMIT}" ]]

- id: recover-identity-bound-lane
  name: gcr.io/google.com/cloudsdktool/google-cloud-cli:573.0.0
  waitFor: [checkout-pinned-controller]
  entrypoint: /bin/bash
  env:
  - CLOUDSDK_CORE_PROJECT=$PROJECT_ID
  - KUBECONFIG=/workspace/ms66-recovery-kubeconfig
  secretEnv:
  - LIGHTYEAR_CLOUDBANK_BASELINE_EVIDENCE_KEY
  args:
  - -ceu
  - |
    trap 'rm -f /workspace/ms66-recovery-kubeconfig' EXIT
    gcloud storage cp "${_RECOVERY_STATE_URI}" /workspace/recovery-state.json \
      --project "$PROJECT_ID"
    printf '%s  %s\n' "${_RECOVERY_STATE_SHA256}" /workspace/recovery-state.json | sha256sum --check -
    gcloud container clusters get-credentials "${_CLUSTER}" \
      --region "${_REGION}" --dns-endpoint --project "$PROJECT_ID"
    cd /workspace/controller
    export LIGHTYEAR_PYTHON=python3
    export LIGHTYEAR_NON_PRODUCTION_ACK=I-AUTHORIZE-MS67-NON-PRODUCTION-MUTATIONS
    state_type="$$(python3 -c \
      'import json; print(json.load(open("/workspace/recovery-state.json", encoding="utf-8")).get("state_type", ""))')"
    recovery_exit=0
    case "$$state_type" in
      lightyear-cloudbank-ms66-isolated-lane-recovery)
        set +e
        bash ./cloudbank-ms66-dual-lane.sh recover \
          --recovery-state /workspace/recovery-state.json \
          --output /workspace/recovery-execution.json \
          --signer "${_SIGNER}"
        recovery_exit=$$?
        set -e
        ;;
      lightyear-cloudbank-journey-recovery)
        target_namespace="$$(python3 -c \
          'import json; print(json.load(open("/workspace/recovery-state.json", encoding="utf-8")).get("namespace", ""))')"
        [[ "$$target_namespace" =~ ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$$ ]]
        set +e
        bash ./cloudbank-journeys.sh recover \
          --project "$PROJECT_ID" --region "${_REGION}" --cluster "${_CLUSTER}" \
          --namespace "$$target_namespace" \
          --recovery-state /workspace/recovery-state.json \
          --output-root /workspace/postgresql-recovery \
          --signer "${_SIGNER}"
        recovery_exit=$$?
        set -e
        if [[ -f /workspace/postgresql-recovery/journeys.json ]]; then
          cp /workspace/postgresql-recovery/journeys.json /workspace/recovery-execution.json
        fi
        ;;
      *)
        echo "Unsupported MS66 recovery state type" >&2
        exit 2
        ;;
    esac
    [[ -s /workspace/recovery-execution.json ]] || exit "$$recovery_exit"
    destination="${_EVIDENCE_BUCKET_PREFIX}/ms66-recovery-$BUILD_ID"
    gcloud storage cp /workspace/recovery-execution.json "$$destination/recovery-execution.json" \
      --project "$PROJECT_ID"
    digest="$$(sha256sum /workspace/recovery-execution.json | cut -d' ' -f1)"
    printf '%s  %s\n' "$$digest" ./recovery-execution.json > /workspace/SHA256SUMS
    gcloud storage cp /workspace/SHA256SUMS "$$destination/SHA256SUMS" --project "$PROJECT_ID"
    echo "MS66_RECOVERY_STATE_TYPE=$$state_type"
    echo "MS66_LANE_RECOVERY_EVIDENCE=$$destination/"
    if [[ "$$recovery_exit" -eq 0 ]]; then
      echo "MS66_LANE_RECOVERY=PASSED"
    else
      echo "MS66_LANE_RECOVERY=FAILED"
      exit "$$recovery_exit"
    fi

availableSecrets:
  secretManager:
  - versionName: projects/$PROJECT_ID/secrets/${_EVIDENCE_SECRET}/versions/latest
    env: LIGHTYEAR_CLOUDBANK_BASELINE_EVIDENCE_KEY
options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: '20'
  logging: CLOUD_LOGGING_ONLY
tags:
- ms67-ms66-recovery
timeout: 1800s
