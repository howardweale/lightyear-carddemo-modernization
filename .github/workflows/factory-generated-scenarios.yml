name: Factory generated scenarios
on:
  pull_request:
    paths:
      - 'src/lightyear_mainframe/**'
      - 'tools/check_generated_scenarios.py'
      - 'tests/test_scenario_generation.py'
      - '.github/workflows/factory-generated-scenarios.yml'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.ref == 'refs/heads/main' && github.run_id || 'branch' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  public-generators:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: src:.:tests
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: bash tools/legacy_twin/install-pinned.sh
      - run: python -B -m unittest test_scenario_generation test_scenario_coverage test_legacy_twin
      - run: python -B -m tools.check_generated_scenarios work/generated-scenarios
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-generated-scenarios
          path: work/generated-scenarios
