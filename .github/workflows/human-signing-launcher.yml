name: Human signing launcher spawn regression
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.ref == 'refs/heads/main' && github.run_id || 'branch' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  launcher-spawn:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install public verification dependency
        run: python -m pip install cryptography==46.0.3
      - name: Real launcher with disposable spawn worker (no token)
        env:
          PYTHONPATH: src:.:tests
        run: python -B -m unittest test_human_signing_launcher test_human_signing_command -v
