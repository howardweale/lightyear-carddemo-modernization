spring:
  application:
    name: checks
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:check-messages.sql
  cloud:
    config:
      import-check:
        enabled: false
  config:
    import: classpath:common.yaml
account:
  journal:
    url: ${ACCOUNT_JOURNAL_URL:http://account:8080/api/v1/account/journal}
cloudbank:
  security:
    service-token:
      enabled: true
      token-uri: ${CLOUDBANK_SECURITY_SERVICE_TOKEN_URI}
      client-id: ${CLOUDBANK_SECURITY_SERVICE_TOKEN_CLIENT_ID}
      client-secret: ${CLOUDBANK_SECURITY_SERVICE_TOKEN_CLIENT_SECRET}
      scope: cloudbank.internal
